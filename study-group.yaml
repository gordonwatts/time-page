- id: evt-003
  type: meeting
  title: Conveener Meeting
  date: '2026-03-23'
  important: false
  summary_md: '

    # Quick recap


    Gordon and Michael met to work on a document outlining organizational changes
    and recommendations for Atlas''s AI integration efforts across different focus
    areas. They discussed and refined the structure of their document, distinguishing
    between "organizational changes" (structural modifications to Atlas groups) and
    "implement" sections (specific recommendations for ML practices). They reviewed
    three main areas: event generation and simulation, trigger and real-time systems,
    and monitor data analysis. The conversation covered topics including open data
    portals, simulation validation processes, ML framework standardization, and the
    need for better integration of ML tools across different groups. They agreed to
    continue their work the following day to complete the document, which needs to
    be finished before the committee review.


    ## Next steps


    - Michael: Assess the current process for making data/simulation datasets publicly
    available (including the use of JIRA tickets and the certification process), and
    suggest improvements for efficiency.

    - Gordon and Michael: Continue reviewing and organizing the document, aiming to
    complete the remaining focus areas in the next meeting.

    - Gordon: Send a meeting invite for the next session to continue document review
    and completion.

    - Michael: Add/adjust text in the document to address the need to accelerate development
    and validation of new ML-based simulation, including validation standards and
    workflows.

    - Gordon and Michael: Reorganize and clarify the document structure, including
    updating section titles (e.g., from "changes in practices" to "organizational
    changes to current Atlas") and ensuring cross-cutting concerns and infrastructure
    needs are appropriately referenced.

    - Gordon and Michael: For the trigger and real-time systems section, define and
    clarify requirements for a registry of ML projects, tooling, training infrastructure,
    and workflows, and address integration with event filter technology and group
    structure changes as needed.

    - Gordon and Michael: For operations and detector control, define validation standards
    and verification plans for ML/agent-based systems, and consider how shift structures
    may need to change with the introduction of agents.

    - Gordon and Michael: Meet again tomorrow at 5pm Michael''s time to complete the
    document review and prepare it for broader group input.


    ## Summary


    ### Atlas Mandate Implementation Discussion


    Michael and Gordon discussed their work on implementing changes related to Atlas''s
    mandate, focusing on how to organize the system to leverage AI effectively. Michael
    expressed confusion about the distinction between implementing changes and making
    general adjustments, while Gordon suggested clarifying the difference between
    specific actions Atlas should take and broader organizational improvements. They
    also briefly touched on the process of selecting proposals for Phase 1 LOIs, noting
    the challenges involved due to limited submission numbers and internal dynamics
    at universities like Berkeley and Slack.


    ### Document Structure Reorganization Discussion


    Gordon and Michael discussed reorganizing the structure of their document, focusing
    on three main sections: cross-cutting concerns (covering infrastructure needs),
    organizational changes (addressing areas where improvements can be made), and
    implementation (covering specific recommendations). They agreed that infrastructure
    concerns should be addressed in the cross-cutting concerns section rather than
    repeating them in multiple focus areas. The discussion concluded with them deciding
    to leave the current document structure unchanged for now while they continue
    to refine the terminology and organization in their heads.


    ### Open Data Portal Assessment


    Gordon and Michael discussed the current state of open datasets and the open data
    portal, considering whether it meets their needs. They explored the possibility
    of creating a dedicated group focused on scientific datasets and workflows for
    generating open datasets. The conversation also touched on the potential for easier
    access to open data, particularly in light of external efforts like Genesis and
    the Treasure project. They concluded by assessing the functionality of the current
    open data portal.


    ### Atlas Simulation Certification Process Review


    Gordon and Michael discussed challenges with the current simulation and data publishing
    certification process in Atlas, particularly regarding the validation of ML-based
    methods. They identified the need to assess the current process and make it more
    streamlined, potentially reducing it to a simple form or email submission. The
    conversation touched on the complexity of creating a general fast Monte Carlo
    simulation versus one tailored for specific analyses, and they agreed to leave
    the discussion general for now. They also briefly considered future possibilities
    for on-demand ultra-fast simulations but decided to focus on immediate improvements
    to the current process.


    ### Atlas Integration and Data Standardization


    Gordon and Michael discussed organizational changes related to Atlas integration
    and simulation efforts, focusing on standardizing training workflows and preventing
    redundant work across CP groups. They identified infrastructure challenges, particularly
    around data compatibility issues between different frameworks used for tagging
    tau particles and jets. The conversation highlighted the need for better cross-group
    data production and common frameworks, with Michael noting specific challenges
    around tau and B-tagger training due to incompatible jet algorithms and data sets.


    ### Organizational Changes Document Updates


    Gordon and Michael discussed updates to a document, focusing on refining language
    around organizational changes and practices. They agreed to use "organizational
    changes to current Atlas practice" instead of "changes in practices" and discussed
    the role of SALT as a potential starting point for expansion. They also touched
    on the appropriateness of using transformer-based networks and the need for minimal
    intervention in workflows. The conversation concluded with plans to continue reviewing
    the document and making necessary adjustments.


    ### ML Systems Integration Progress Review


    Gordon and Michael discussed progress on trigger and real-time systems, focusing
    on areas such as creating a registry of ML projects, developing tooling and training
    infrastructure, and establishing a requirements framework to streamline the process
    of integrating ML algorithms into trigger systems. They highlighted tensions around
    integration between Atlas and HLS for ML and noted the need for better coordination
    between ML R&D and broader ML efforts. The discussion also touched on organizational
    changes within the trigger group, validation standards for agent systems, and
    the need to define ownership and governance structures. They agreed to continue
    the discussion the following day to finalize their review and complete the task
    for the committee.

    '
