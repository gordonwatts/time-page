- id: evt-001
  type: external
  title: Committee Mandate
  date: '2026-02-19'
  important: false
  summary_md: 'The ATLAS Artificial Intelligence and Machine Learning (AI/ML) Study
    Group is established to assess the experiment’s readiness to integrate AI/ML activities
    more broadly, covering online, offline and other non-technical applications. The
    aim is to evaluate whether the current ATLAS structures are sufficient for the
    experiment to keep pace with AI/ML advancements, reduce duplication of effort,
    promote best practices and coherence, and accelerate the efficient adoption of
    AI/ML techniques throughout the collaboration.




    If the study group concludes that a new organisational structure should be established
    within ATLAS, it is important to clarify its scope. Such a structure would not
    be responsible for algorithmic developments dedicated to specific applications.
    Algorithmic developments within Computing and Software, within the Physics and
    CP groups, as well as in the Trigger and Data Preparation areas, will remain under
    the responsibility of those groups. Instead, the study group — and any new structure
    that may be created — would focus on \*\*strategy, software, and the development
    of common tools and infrastructure\*\*.




    \[Full Mandate](https://docs.google.com/document/d/1JylfBTBrv0sLo0ry508WflUvnSNDEj589w2IPqck-Ps)




    '
