- id: evt-004
  type: meeting
  title: Conveener Meeting
  date: '2026-03-18'
  important: false
  summary_md: '# Quick recap


    Gordon and Michael discussed their recent attendance at a music festival on a
    ranch organized by Farm Aid, where Gordon was volunteering with CERN''s outreach
    efforts. They then focused on planning future Atlas recommendations regarding
    AI and machine learning integration, agreeing to structure their work around identifying
    specific needs rather than getting distracted by technical details or disruption
    concerns. They decided to focus on practical needs like scaling up models, developing
    computing infrastructure, and potentially restructuring how Atlas handles corrections
    and calibrations, while leaving aside discussions about foundation models and
    LLMs for now. The conversation concluded with plans to reconvene in an hour to
    develop discussion topic areas for future meetings.


    ## Next steps


    * Gordon \& Michael: Meet again in one hour to continue discussion on forming
    discussion topic areas for the group.

    * Gordon \& Michael: Come up with a few discussion topic areas, discuss, and ask
    group members to think about/add to them.

    * Gordon \& Michael: Assign "homework" to group members to consider the proposed
    discussion topics and provide feedback or additional topics.


    ## Summary


    ### CERN Music Festival Fundraiser


    Gordon discussed a music festival on a former movie set that raises funds for
    farms, including Farm Aid. He explained that Connie Potter, who previously worked
    at CERN and now focuses on music outreach, helped establish a pavilion called
    the Quantum Corral for outreach and demonstrations for about 5,000 people. Michael
    shared a story about Christian Ohm offering free CERN tours through a local radio
    station competition, including one for someone in Taylor Swift''s production team.


    ### VIP Event Experience Discussion


    Gordon shared his experience attending a VIP dinner and music festival in Texas,
    describing the event''s atmosphere, costs, and food. He explained that he paid
    for the trip himself and was invited to volunteer after being reliable in previous
    roles. Michael expressed interest in potentially getting involved in similar events
    and asked Gordon for advice on how to do so.


    ### ML Discussion Management Strategy


    Gordon and Michael discussed the challenges of managing diverse ideas during recent
    discussions about ML topics. They agreed that a focused approach would be needed
    to avoid expanding discussions indefinitely, with Gordon suggesting the implementation
    of a "corralling mechanism" to funnel conversations toward specific conclusions.
    Michael noted the presence of different groups, including ML tool builders and
    occasional ML users, and suggested separating discussions into categories, potentially
    including foundation models and LLMs. Michael also proposed forming a task force
    to conduct the first Agentic Atlas analysis.


    ### Research Project and Task Focus


    Gordon and Michael discussed ongoing research efforts related to a project, with
    Gordon mentioning that several groups, including ones at LBL and UChicago, are
    already working on it. They criticized a recent paper by Hai Chan, describing
    it as typical of early work in the field. The conversation shifted to concerns
    about the task force getting distracted from its main objectives, with Gordon
    acknowledging that while their discussion about technical aspects was important,
    they should have focused more on making specific recommendations.


    ### Atlas LLM Capabilities Gap Discussion


    Michael and Gordon discussed working backwards from the question of whether Atlas
    is set up to take advantage of LLM capabilities, with Michael confirming that
    Atlas is not currently set up for LLM-based code writing or analysis. They identified
    this as an obvious gap that needs addressing through recommendations. The discussion
    touched on emerging concerns about disruption, with Gordon comparing the situation
    to tugboats trying to change direction of a supertanker, though specific details
    about the disruption concerns were not fully elaborated in the transcript.


    ### Technological Disruption Prediction Challenges


    Gordon and Michael discussed the challenges of predicting technological disruptions
    over the next 3-4 years, particularly regarding LLMs and their impact on physics
    research. They agreed to focus on ensuring the initial physics results from HLHC
    come out on time and accurately, rather than speculating about future technological
    changes. The conversation ended with Michael mentioning concerns about potential
    overhauls to the ML forum, which he had discussed with Daniel Murnane.


    ### System Upgrade and Restructuring Discussion


    Michael and Gordon discussed the need to upgrade and restructure certain systems,
    particularly focusing on CP groups and Atlas''s approach to corrections. They
    agreed to start by identifying key needs, such as computing infrastructure, hardware,
    and training platforms, especially in light of scaling up models. Gordon highlighted
    the potential for changing the publication structure to enable more AI-related
    work and suggested reevaluating how CP groups operate. They decided to meet again
    in an hour to further discuss and outline specific discussion topics for the group,
    with plans to assign homework to participants to avoid overwhelming themselves
    with the scope of work.




    \# Part 2




    # Quick recap


    Michael and Gordon discussed the development of a report focused on integrating
    AI into the Atlas experiment, emphasizing the need to balance foundational infrastructure
    with transformative changes. They explored ideas for improving reconstruction,
    trigger, and simulation processes, while considering the sociological aspects
    of implementing AI within existing structures. Gordon suggested creating a menu
    of options for different levels of AI integration, ranging from incremental improvements
    to more significant overhauls, to allow the Atlas community to choose paths that
    align with their capabilities and goals. They agreed to draft initial ideas for
    each focus area and supporting infrastructure, with Michael and Gordon planning
    to review and refine these concepts before presenting them to the broader committee.


    ## Next steps


    * Gordon: Create a Google Doc with focus areas and introductory paragraph for
    organizing report ideas, including infrastructure/supporting services

    * Michael and Gordon: Review meeting summaries and fill out Google Doc with high-level
    goals and infrastructure needs for each focus area by the weekend

    * Michael and Gordon: Meet Monday at 7:30-8:30 PM Gordon''s time (3:30-4:30 CERN
    time) to discuss their contributions

    * Michael: Send out Doodle poll for next meeting time during the week of the 30th,
    between 4-6 PM CERN time

    * Michael: Notify Lucas about rescheduling PhD interviews

    * Michael and Gordon: Present their Google Doc to the committee for review and
    input


    ## Summary


    ### Genesis Project RFP Discussion


    Michael and Gordon discussed the Genesis project and a recent RFP with a $500,000
    budget for a 6-month period. They expressed concerns about the timeline and feasibility
    of the grant, noting that it would require existing team members to redirect their
    focus, potentially impacting other projects. Michael shared that Genesis has been
    operating as an ongoing sprint due to previous urgent funding needs, and while
    there is now real money involved, there are questions about where the $300 million
    total budget is coming from across different physics programs.


    ### Physics Program Merger Discussion


    Michael and Gordon discussed the recent merger of nuclear and high energy physics
    programs, which Gordon noted could potentially allow for joint grant applications.
    They explored concerns about the Genesis mission''s approach, with Michael suggesting
    it might be building itself to fail by pulling funding from groups not well-suited
    for AI development. The conversation highlighted tensions between externally imposed
    funding constraints and scientific expertise, with both agreeing that current
    funding decisions might not align with optimal scientific progress.


    ### Community vs Top-Down Decision Processes


    Gordon and Michael discussed the balance between community-driven consensus processes
    like Snowmass and top-down decision-making by organizations like DOE and NSF.
    While Gordon defended the community consensus approach, Michael expressed concerns
    about its effectiveness for their larger group size and suggested considering
    alternative methods. The conversation ended with Gordon agreeing to a more top-down
    approach for their AIML study group, though he noted the importance of being able
    to propose ideas even when facing pushback.


    ### Report Structure and Content Planning


    Gordon and Michael discussed the structure and content of a report they are working
    on. They focused on balancing technical needs with sociological aspects, emphasizing
    the importance of creating an environment where innovative work can thrive. Gordon
    suggested organizing the report to present different levels of disruption, ranging
    from minor improvements to more significant changes, with associated cost and
    benefit analyses for each option.


    ### Report Structure and Recommendations Approach


    Gordon and Michael discussed the approach for their report, focusing on presenting
    a menu of options rather than making definitive decisions themselves. They agreed
    to structure their recommendations by considering both top-level (physics-focused)
    and bottom-level (infrastructure) approaches, with the goal of ensuring that lower-level
    recommendations could support higher-level initiatives. Michael suggested working
    to gather impactful ML ideas across different groups alongside the necessary infrastructure
    requirements, noting that including these options in their report could give them
    momentum for future adoption.


    ### Task Force Project Scope Discussion


    Michael and Gordon discussed the interpretation of their task force''s charge
    regarding project overlap with existing groups. Gordon clarified that he didn''t
    interpret the restriction as preventing recommendations that might affect other
    groups'' projects, but rather as limiting the scope of what the task force would
    directly take on. They explored different approaches to integrating AI into Atlas,
    with Gordon suggesting a spectrum from minor adjustments to major reorganization,
    and Michael proposing the example of providing scaling infrastructure that would
    benefit all CP groups.


    ### Project Expansion in Trigger Systems


    Michael and Gordon discussed potential areas beyond reconstruction and data analysis
    in their project, including operations and trigger systems. They explored opportunities
    in high-level trigger (HLT) and L1 systems, with Gordon suggesting these might
    require different approaches than reconstruction. Michael proposed developing
    a classifier across data analyses and highlighted the importance of ML operations,
    including pipeline optimization and reducing the need for individual ML engineers.


    ### Balancing Ambitious Ideas with Realism


    Michael and Gordon discussed the need to balance ambitious ideas with practical,
    achievable goals in their report. They agreed to focus on realistic, near-term
    possibilities rather than "pie-in-the-sky" concepts like complete end-to-end differential
    analysis pipelines. Gordon suggested organizing the report by focus areas, starting
    with infrastructure like MLOps, and developing bullet point ideas for each area.


    ### AI Infrastructure Report Planning


    Gordon and Michael discussed creating a report outline focusing on AI infrastructure
    and supporting services across different focus areas. They agreed to develop a
    Google Doc outlining high-level goals and necessary infrastructure for each area,
    including considerations for MLOps teams and affordable implementation strategies.
    They scheduled a follow-up meeting for Monday at 7:30 PM Gordon''s time (3:30-4:30
    PM CERN time) to review their progress, and Michael will create a Doodle poll
    for the week of the 30th to schedule future meetings.




    '
