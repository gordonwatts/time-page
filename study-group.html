mmarizing key information and groups, with Michael taking the lead on drafting this tomorrow. They also mentioned plans to implement 15-minute reports starting on the 20th, though the final format is still being determined.<\/p>\n", "minutes_html": ""}, {"id": "AI/ML study group-1681122", "type": "meeting", "title": "DQ, monitoring and validations focus area", "date": "2026-04-28", "important": true, "short_label": "AI/ML in DQ", "summary_md": "[Link To Indico](https://indico.cern.ch/event/1681122/)", "minutes_md": "## Notes from discussion with DQ, monitoring and validations experts, 28/4 2026\n\nPresent: Elin Bergeaas Kuutmann, Elisabeth Schopf, Peter Onyisi, Catrin Bernius, Riccardo Bianchi, Liza Mijovic, Verena Martinez Outschoorn, Joaquin Hoya, Bertrand Dit Latour, , Sara Strandberg, Ioannis Xiotidis\n\nQuestions discussed\n\n- Which are the AI/ML efforts within your area that ATLAS should actively pursue?\n- Which are the current AI/ML activities ongoing in your community?\n\n- Which of these could be done more efficiently?\n\n- Are there activities that are not currently pursued due to insufficient support?\n- Are you aware of broader activities going on that are of relevance to ATLAS’ AI/ML strategy (e.g. SCOPE and GENESIS)? Or do you have ideas on how we can survey the community to understand what is going on?\n- What is your vision regarding the use of AI/ML in DQ monitoring and/or validation for Run 4?\n\n- What would be needed to take us there (infrastructure/software/hardware/…)?\n- Do you have any thoughts on how we should organize the AI/ML work within ATLAS to achieve your vision?\n\nGeneral (Catrin)\n\n- The operations team (DQ included) is currently working very hard to complete Run 3, and it is therefore hard for these groups to have time to think about AI/ML for Run 4. We should thus not rush this. Better to focus on this after the data-taking is over.\n\nDQ (Elin)\n\n<https://indico.cern.ch/event/1681122/contributions/7066806/attachments/3265206/5831385/DQ%20input%20to%20AI_ML%20working%20group,%2028%20April%202026.pdf>\n\n- Main goal of AI/ML is to save person-power, not to have AI/ML do everything in a completely autonomous way\n- What is done now?\n\n- Autoencoder-based time series anomaly detection for ATLAS Liquid Argon calorimeter data quality monitoring (ATL-DAPR-PUB-2024-002). Vilius Cepaitis.\n- Agents to dynamically create new references (GENESIS). Walter Hopkins, Peter Onyisi.\n- TileCal are also working on automation\n- Meeting on automation in DQM:  https://indico.cern.ch/event/1587918/\n\n- What should be actively pursued?\n\n- ML for automation (anomaly detection, LLMs for instructions/evaluation of defect severeness)\n\n- Can support shifters, harmonize assessment and account for varying conditions in an automated way\n\n- ML to gather information from different sources\n\n- What can we do to do work more efficiently?\n\n- It would be good to have better coordination within the subgroups of DQ.\n- There is currently a bottleneck in getting access to the data and the tools - make all the data AI ready\n\n- Activities falling behind due to insufficient support?\n\n- Databases are not defined yet\n- Access to information is generally an issue\n- There is a need for common infrastructure (across DQ groups)\n- Some groups suffer from resources to train the AI/ML models on\n\n- The vision:\n\n- A mixed approach with both machine and human assessment\n- Reduce the amount of steps and tools involved in DQ assessment\n\nGENESIS DQ I (Peter)\n\n- Elin’s slide 6 shows pretty much what they are planning for GENESIS DQ\n\n- Agent that can read documentation and whiteboards to assist the shifters (LLM)\n\n- GENESIS is an opportunity to get funding for some of this development work. Phase-1 proposals all have deliverables planned for next year\n\nQ: What happens if the GENESIS projects are not funded? -> will know if funded in the next couple of months. if not funded, then need to have a serious discussion about what to prioritize and how to lay it out over time given the resources.\n\nGENESIS DQ II (Catrin)\n\n- data that can be tokenized. to be able to pull into AI/ML agents and e.g. correlate with CDQ data, lumi data etc.\n- LLMs for documentation\n\nDQ core infrastructure (Peter)\n\n- Q: Are there many changes to the DQ infrastructure needed to accommodate AI/ML?\n\n- Many changes needed to core DQ infrastructure, but mainly evolutional.\n- Finer grained time information (as mentioned by Elin as a potential development) might be more challenging given that the data volume increases.\n\nPhysics Validation (Riccardo)\n\n- Use case is very similar to DQ.\n- No efforts ongoing at the moment.\n- Had two ATLAS software grants in 2024 and 2025, and those were to work on a new common software framework for validation. So far each domain has had its own framework. This needed to be in place before any AI/ML activities could start.\n- Think about if it would make sense to merge the core infrastructure for DQ and PhysVal for Run4.\n\nThoughts on how to organize AI/ML activities within DQ, monitoring and validation\n\n- Catrin: Not good to pull everything into the ML forum. But if ML forum can have facilitators that reach out to eg DQ, that would be good.\n- Also, many automation projects that are not using AI/ML, and if in ML forum, then you would lose connection to these.\n- Liza: Second what Catrin says. Better to leave the AI/ML development work in the subgroups. Facilitating and implementing AI/ML is not the main challenge in these areas, but the understanding of the detector and the data.", "participants": ["Liza Mijovic", "Riccardo Maria Bianchi", "Catrin Bernius", "Elin Bergeaas Kuutmann", "Elisabeth Schopf", "Lee Sawyer", "Peter Onyisi", "Serguei Kolos", "Bertrand Martin Dit Latour", "Ioannis Xiotidis", "Joaquin Hoya", "Sara Strandberg"], "tags": [], "documents": [{"label": "DQ input to AI_ML working group, 28 April 2026.pdf", "url": "https://indico.cern.ch/event/1681122/contributions/7066806/attachments/3265206/5831385/DQ%20input%20to%20AI_ML%20working%20group,%2028%20April%202026.pdf", "talk_title": "AI/ML in DQ", "speaker_names": ["Catrin Bernius", "Elin Bergeaas Kuutmann", "Elisabeth Schopf", "Lee Sawyer", "Peter Onyisi", "Serguei Kolos"]}], "contributions": [{"title": "Discussion", "speaker_names": ["Bertrand Martin Dit Latour", "Ioannis Xiotidis", "Joaquin Hoya", "Sara Strandberg"], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "AI/ML in DQ", "speaker_names": ["Catrin Bernius", "Elin Bergeaas Kuutmann", "Elisabeth Schopf", "Lee Sawyer", "Peter Onyisi", "Serguei Kolos"], "documents": [{"label": "DQ input to AI_ML working group, 28 April 2026.pdf", "url": "https://indico.cern.ch/event/1681122/contributions/7066806/attachments/3265206/5831385/DQ%20input%20to%20AI_ML%20working%20group,%2028%20April%202026.pdf", "talk_title": "AI/ML in DQ", "speaker_names": ["Catrin Bernius", "Elin Bergeaas Kuutmann", "Elisabeth Schopf", "Lee Sawyer", "Peter Onyisi", "Serguei Kolos"]}], "minutes_md": null, "minutes_html": ""}, {"title": "AI/ML in Physics Validation", "speaker_names": ["Liza Mijovic", "Riccardo Maria Bianchi"], "documents": [], "minutes_md": null, "minutes_html": ""}], "source_name": "AI/ML study group", "source_color": "#dee5f5", "summary_html": "<p><a href=\"https://indico.cern.ch/event/1681122/\" target=\"_blank\" rel=\"noopener noreferrer\">Link To Indico<\/a><\/p>\n", "minutes_html": "<h2>Notes from discussion with DQ, monitoring and validations experts, 28/4 2026<\/h2>\n<p>Present: Elin Bergeaas Kuutmann, Elisabeth Schopf, Peter Onyisi, Catrin Bernius, Riccardo Bianchi, Liza Mijovic, Verena Martinez Outschoorn, Joaquin Hoya, Bertrand Dit Latour, , Sara Strandberg, Ioannis Xiotidis<\/p>\n<p>Questions discussed<\/p>\n<ul>\n<li>\n<p>Which are the AI/ML efforts within your area that ATLAS should actively pursue?<\/p>\n<\/li>\n<li>\n<p>Which are the current AI/ML activities ongoing in your community?<\/p>\n<\/li>\n<li>\n<p>Which of these could be done more efficiently?<\/p>\n<\/li>\n<li>\n<p>Are there activities that are not currently pursued due to insufficient support?<\/p>\n<\/li>\n<li>\n<p>Are you aware of broader activities going on that are of relevance to ATLAS’ AI/ML strategy (e.g. SCOPE and GENESIS)? Or do you have ideas on how we can survey the community to understand what is going on?<\/p>\n<\/li>\n<li>\n<p>What is your vision regarding the use of AI/ML in DQ monitoring and/or validation for Run 4?<\/p>\n<\/li>\n<li>\n<p>What would be needed to take us there (infrastructure/software/hardware/…)?<\/p>\n<\/li>\n<li>\n<p>Do you have any thoughts on how we should organize the AI/ML work within ATLAS to achieve your vision?<\/p>\n<\/li>\n<\/ul>\n<p>General (Catrin)<\/p>\n<ul>\n<li>The operations team (DQ included) is currently working very hard to complete Run 3, and it is therefore hard for these groups to have time to think about AI/ML for Run 4. We should thus not rush this. Better to focus on this after the data-taking is over.<\/li>\n<\/ul>\n<p>DQ (Elin)<\/p>\n<p><a href=\"https://indico.cern.ch/event/1681122/contributions/7066806/attachments/3265206/5831385/DQ%20input%20to%20AI_ML%20working%20group,%2028%20April%202026.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://indico.cern.ch/event/1681122/contributions/7066806/attachments/3265206/5831385/DQ input to AI_ML working group, 28 April 2026.pdf<\/a><\/p>\n<ul>\n<li>\n<p>Main goal of AI/ML is to save person-power, not to have AI/ML do everything in a completely autonomous way<\/p>\n<\/li>\n<li>\n<p>What is done now?<\/p>\n<\/li>\n<li>\n<p>Autoencoder-based time series anomaly detection for ATLAS Liquid Argon calorimeter data quality monitoring (ATL-DAPR-PUB-2024-002). Vilius Cepaitis.<\/p>\n<\/li>\n<li>\n<p>Agents to dynamically create new references (GENESIS). Walter Hopkins, Peter Onyisi.<\/p>\n<\/li>\n<li>\n<p>TileCal are also working on automation<\/p>\n<\/li>\n<li>\n<p>Meeting on automation in DQM:  https://indico.cern.ch/event/1587918/<\/p>\n<\/li>\n<li>\n<p>What should be actively pursued?<\/p>\n<\/li>\n<li>\n<p>ML for automation (anomaly detection, LLMs for instructions/evaluation of defect severeness)<\/p>\n<\/li>\n<li>\n<p>Can support shifters, harmonize assessment and account for varying conditions in an automated way<\/p>\n<\/li>\n<li>\n<p>ML to gather information from different sources<\/p>\n<\/li>\n<li>\n<p>What can we do to do work more efficiently?<\/p>\n<\/li>\n<li>\n<p>It would be good to have better coordination within the subgroups of DQ.<\/p>\n<\/li>\n<li>\n<p>There is currently a bottleneck in getting access to the data and the tools - make all the data AI ready<\/p>\n<\/li>\n<li>\n<p>Activities falling behind due to insufficient support?<\/p>\n<\/li>\n<li>\n<p>Databases are not defined yet<\/p>\n<\/li>\n<li>\n<p>Access to information is generally an issue<\/p>\n<\/li>\n<li>\n<p>There is a need for common infrastructure (across DQ groups)<\/p>\n<\/li>\n<li>\n<p>Some groups suffer from resources to train the AI/ML models on<\/p>\n<\/li>\n<li>\n<p>The vision:<\/p>\n<\/li>\n<li>\n<p>A mixed approach with both machine and human assessment<\/p>\n<\/li>\n<li>\n<p>Reduce the amount of steps and tools involved in DQ assessment<\/p>\n<\/li>\n<\/ul>\n<p>GENESIS DQ I (Peter)<\/p>\n<ul>\n<li>\n<p>Elin’s slide 6 shows pretty much what they are planning for GENESIS DQ<\/p>\n<\/li>\n<li>\n<p>Agent that can read documentation and whiteboards to assist the shifters (LLM)<\/p>\n<\/li>\n<li>\n<p>GENESIS is an opportunity to get funding for some of this development work. Phase-1 proposals all have deliverables planned for next year<\/p>\n<\/li>\n<\/ul>\n<p>Q: What happens if the GENESIS projects are not funded? -&gt; will know if funded in the next couple of months. if not funded, then need to have a serious discussion about what to prioritize and how to lay it out over time given the resources.<\/p>\n<p>GENESIS DQ II (Catrin)<\/p>\n<ul>\n<li>data that can be tokenized. to be able to pull into AI/ML agents and e.g. correlate with CDQ data, lumi data etc.<\/li>\n<li>LLMs for documentation<\/li>\n<\/ul>\n<p>DQ core infrastructure (Peter)<\/p>\n<ul>\n<li>\n<p>Q: Are there many changes to the DQ infrastructure needed to accommodate AI/ML?<\/p>\n<\/li>\n<li>\n<p>Many changes needed to core DQ infrastructure, but mainly evolutional.<\/p>\n<\/li>\n<li>\n<p>Finer grained time information (as mentioned by Elin as a potential development) might be more challenging given that the data volume increases.<\/p>\n<\/li>\n<\/ul>\n<p>Physics Validation (Riccardo)<\/p>\n<ul>\n<li>Use case is very similar to DQ.<\/li>\n<li>No efforts ongoing at the moment.<\/li>\n<li>Had two ATLAS software grants in 2024 and 2025, and those were to work on a new common software framework for validation. So far each domain has had its own framework. This needed to be in place before any AI/ML activities could start.<\/li>\n<li>Think about if it would make sense to merge the core infrastructure for DQ and PhysVal for Run4.<\/li>\n<\/ul>\n<p>Thoughts on how to organize AI/ML activities within DQ, monitoring and validation<\/p>\n<ul>\n<li>Catrin: Not good to pull everything into the ML forum. But if ML forum can have facilitators that reach out to eg DQ, that would be good.<\/li>\n<li>Also, many automation projects that are not using AI/ML, and if in ML forum, then you would lose connection to these.<\/li>\n<li>Liza: Second what Catrin says. Better to leave the AI/ML development work in the subgroups. Facilitating and implementing AI/ML is not the main challenge in these areas, but the understanding of the detector and the data.<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1683069", "type": "meeting", "title": "Reconstruction, Calibration & Analysis", "date": "2026-05-04", "important": false, "short_label": null, "summary_md": "[Link To Indico](https://indico.cern.ch/event/1683069/)", "minutes_md": null, "participants": ["Dan Guest", "Daniel Thomas Mur "minutes_md": null, "minutes_html": ""}], "source_name": "AI/ML study group", "source_color": "#dee5f5", "summary_html": "<p><a href=\"https://indico.cern.ch/event/1690815/\" target=\"_blank\" rel=\"noopener noreferrer\">Link To Indico<\/a><\/p>\n<p><a href=\"https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28\" target=\"_blank\" rel=\"noopener noreferrer\">Template for presentation<\/a> (note, copy before modifying!)<\/p>\n", "minutes_html": ""}, {"id": "Offline Activity Coordination Board-1688935", "type": "meeting", "title": "Offline Activity Coordination Board", "date": "2026-06-01", "important": true, "short_label": "Approval of minutes of last meeting, Follow-up items, AI/ML study group status", "summary_md": "[Link To Indico](https://indico.cern.ch/event/1688935/)\n\n[Link to all OAB meetings and minutes](https://atlas-trigger.web.cern.ch/atlas-trigger/triggermeetings/oab.html) (by [indicomb](https://twiki.cern.ch/twiki/bin/viewauth/AtlasProtected/Indicomb))", "minutes_md": "## Round table\n\n- 2025 data reprocessing status\n  - 1 job of physics main still running (at 9 am today)\n  - How we dealt with failures:\n    - Run 4992459 LB  784: SIGHUP, fixes with 24.0.129.2\n    - Run  504676, LB 384: Algorithm timeout (muon backtracking) : Increase timeout to 3h\n    - Run 504403 LB 578: Missing data in /TRIGGER/LUMI/LBLB: Give up, GLOBAL\\_OFFLINE\\_PROCESSING\\_PROBLEM defect)\n  - A few merging problems required manual intervention by ADC experts (thanks!)\n- Status of mc23g production\n  - Still significant backlog for mc production:\n    - EVGEN - 24B (23B low priority MG FxFx)\n    - SIM -17B\n    - RECO-4B\n  - mc23g status\n    - High priority CP samples - finished\n    - SIM: 4.42B  (3.2 lower priority CP samples, 0.8 V+jets)\n    - RECO: 2.5B  (100 CP samples,2.4B V+jets high priority)\n- 2025 data and MC Derivations ?   => Started for mc23g (DAOD\\_PHYS/PHYSLITE - for the high priority CP samples mostly ready, need also CP derivations) , should also launch derivation for data (need final container for physics\\_Main\n- Simulation and Digitiuation\n  - mc23g: Reconstruction of CP samples [ongoing](https://prodtask-dev.cern.ch/prodtask/inputlist_with_request/64837/)\n  - AF3 as G4 fast simulation model\n    - PhysVal ([ATLPHYSVAL-1355](https://its.cern.ch/jira/browse/ATLPHYSVAL-1355)): Percent-level differences in Topoclusters and Neutral PFlow distributions considered acceptable by AF3 experts and, to our understanding, by the CP groups\n    - PhysVal ([ATLPHYSVAL-1367](https://its.cern.ch/jira/browse/ATLPHYSVAL-1367)): Final validation comparing the new AF3 with Geant4 using the mc23g setup requested to assess the production readiness\n    - Could start production if this validation is OK (expected this week\n  - Track-overlay\n    - PhysVal ([ATLPHYSVAL-1351](https://its.cern.ch/jira/browse/ATLPHYSVAL-1351))\n      - Observed differences are largely understood (primarily due to missing fake tracks) and have limited impact on high-level physics performance\n      - Signed off by several domains (Topoclusters, MET, Jets, Tau)\n      - Additional material on the Track-overlay methodology and ML-based event selection provided to help validators in the remaining domains\n- Physics validation\n  - In addition to the PhysVal tasks for Simu+Digi (above), we are also currently working on\n    - R25 validations — Latest validated: 25.0.59 ([ATLPHYSVAL-1366](https://its.cern.ch/jira/browse/ATLPHYSVAL-1366))\n    - ACTS validation campaign — [ATLPHYSVAL-1354](https://its.cern.ch/jira/browse/ATLPHYSVAL-1354)\n    - Validation of latest Geant4 patch — [ATLPHYSVAL-1360](https://its.cern.ch/jira/browse/ATLPHYSVAL-1360)\n- Status of release 24\n  - Not a walking dead yet: Will be used for data26pp reprocessing (high and low mu), reprocessing of 2025 and 2026 HI data\n- PbPb data taking\n  - 0.77 nb-1 recorded so far\n- 2026 pp data reprocessing\n  - talk at alignment meeting  <https://indico.cern.ch/event/1691849/contributions/7114050/attachments/3283503/5869517/SMarti_20260528.pdf>\n  - Attempt to apply a quick-and-dirty fix for the alignment problem in period C and D\n    - So far, the new alignment was only tested on the runs that were used to derive them.\n    - Fixes the sagitta-bias but not the d0 (with re-derived beam spot). Salva believes this is ok for Hmumu.\n      - Would it impact d0/sigma cut ?  Could also impact ttH category but has small weigh\n      - Need to verify it works also on other runs (ongoing)\n    - => a couple of checks needed before the “quick” reprocessing can be launched\n    - Proper fix requires re-playing the calibration loo\n- MC for 2026: no specific request yet to have a specific MC campaign. Baseline is to use the mc23g campaign.\n\nAI/ML study group status\n\n- Had semi regular study group meetings, plan weekly meetings in June to prepare ATLAS week report\n- [Mandate](https://twiki.cern.ch/twiki/pub/AtlasProtected/OfflineActivityCoordinationBoard/ATLAS_AI_ML_study_group_-_MANDATE.pdf)  expect to deliver:\n  - Proposed structure (if change required)\n  - Common tools\n  - Publication strategy\n  - Person power requirement\n  - Coordination /Training\n  - Efficient deployment of AI/ML\n\n- Considered 10 focus areas (see slide 5), had also some discussions on impact of CERN AI strategy\n- Two categories of AI/ML, may need different recommendations\n  - ATLAS domain specific models (event selection, reconstruction, calibration,..)\n  - LLMs and agents used by ATLAS\n  - Overlap ? => a bit of possible overlap, e.g chATLAS\n- ATLAS domain specific tools\n  - Interest to centralize framework for training / data handling/ validation (e.g SALT framework)\n  - Interest of feedback / advice from experts\n    - Maybe more direct connection than in topical meetings of ML forum. Could use more “facilitators” of the current ML forum (with experts on various tools, similar organization as stat. forum ?) ?  Need to understand exactly what people want.\n      - “close” meetings of committee would not work for AI/ML\n  - Validation can take up to ~ year. Can some aspects be streamlined ?\n  - Need also to keep some flexibility\n  - Scaling and foundation models:\n    - from FTAG studies, bigger models can still lead to improvements\n    - Foundation model: Learn more general features of data, encompassing many tasks => across CP groups, may need centralized effort, important questions on compute needs for training and inference.\n    - (Computing coord:) significant allocation but not ouf of reach.  (O(10000) GPU-hours “easy, could have O(100000) GPU-hours up to 300000 in some HPC); have to be careful to check large scale requests before the resources are allocated.   Overall for science projects, requests of ~1M GPU-hours are not rare.\n    - We need also to be able to benchmark these foundation models against dedicated tools + check against data.\n\n- LLMs and agents\n  - Coding agents are becoming ubiquitous, important to develop guidelines (also including analysis software)\n  - Agentics LLC can orchestrate complex states, interest in operation and Data quality monitoring.   Full data analysis ?\n  - They are new technologies, unclear what can be built in common, but common infrastructure may be needed.\n  - Need critical exploration and evaluation\n    - Dedicated task forces on specific targets ?\n  - Need some thinking about possible organization\n\n- Computing resources\n  - See discussion above in foundation model training\n  - Inference: big models also need GPU for efficient inference => need specific considerations  (inference as service, hardware, ..)\n  - Agent based running code may require more CPU resources ?\n  - Many founding decisions in sites being done until the start of run 4, may not have a lot of GPU hardware in grid sites in the next few years.\n  - Can possibly significantly change how we apply for computing resources. Challenging to fit in the current ways in which we ask for resources quite a bit in advance.   Would have to understand how to fit this in computing requirements. For instance, would it be more effective to have GPU resources at CERN than in different grid sides ? Currently Tier0 has no GPU resources.   HLT will bring significant GPU resources.  If we want O(10%) of pledge of GPU we have to be sure we use them since we will have then less CPU available (and we do need more compute for run 4)\n    - Different detector at start of run 4, it will be necessary to understand how data is handled, not obvious to do if lots of AI/ML in reconstruction, 100% CPU on Tier0 may be better.\n    - Will probably anyway not go back to simpler models.  Should already think about what we will need.\n    - Cannot have just simple algorithms at the beginning of run 4.\n    - GN2/3 can run inference on CPU anyway.  But we need to study now what kind of GPU we will need in run 4.\n\n- Publications and open data\n  - Not really a policy change\n  - Sense that it is hard to have publication on AI/ML, make people aware of what is possible, clarify rules\n  - Would more limited author list publications be useful ?\n\n- Connections to outside community\n  - AI for science is a hot topic across the world\n  - Several projects, significant funding available\n  - Support ATLAS collaborators in these efforts\n  - Contribute to CERN AI strategy ? would like opportunity to grow international collaboration\n  - Connections to industry ?\n- Sustainability\n  - Equal access to AI models ?\n  - Impact of new hardware ?\n  - Code of conduct is important\n\n- Towards a broadened AI/ML group ? (see slide 16)\n  - Stronger liaisons ?\n  - Cover Model R&D and common framework, training and education\n  - Including ability to spin off dedicated task forces ?\n  - Need to balance centralization vs existing group activities.\n  - CMS has 3 subgroups for ML/AI: knowledge (documentation, ..), performance (common infrastructure,.. ) innovation (exploring new models,..)\n- Further questions\n  - For models provided by outside, need some guidelines / validation on how to use that for things like analysis ?  Also data privacy is important. => should build benchmarks.  If using agents for operation we probably want to host them locally.  => links with Cern AI strategy\n  - Could we involve big companies ? => not discussed yet much in the study group.  Would the industry be interested ? => probably ATLAS/CERN carry some values.    We may profit from some expertise on agentic tools.\n    - One example of that would be the usage of the indico dataset.\n  - What is the figure of merit for improvements ? Should we for instance take into account the cost in the flavor tagging algorithm optimization => come back to the compute resources.\n  - Traditionally Tier0 resources are used for production not for training.\n  - Have probably to separate resources for training and inference.\n  - Include also some discussions of the concerns raised in the ATLAS week presentation\n  - Important to have a message on how to organize effort, and how to adapt to tools/algorithms  which are moving fast.\n- Next steps\n  - Presentation of preliminary recommendation + (guided) discussion at ATLAS week in June", "participants": ["Anna Sfyrla", "Guillaume Unal", "Gordon Watts", "Michael Kagan"], "tags": [], "documents": [{"label": "minutes 19 May 2026", "url": "https://indico.cern.ch/event/1686961/?note=384322", "talk_title": "Approval of minutes of last meeting", "speaker_names": ["Anna Sfyrla", "Guillaume Unal"]}, {"label": "google doc link", "url": "https://docs.google.com/document/d/1tOa02RW8fyHPP26TTqFc8qbchnGRZnISyVHbgLHevnY/edit?tab=t.0#heading=h.1zzf6yxuzaew", "talk_title": "Follow-up items", "speaker_names": []}, {"label": "OAB_June1-2026.pdf", "url": "https://indico.cern.ch/event/1688935/contributions/7099795/attachments/3285222/5872251/OAB_June1-2026.pdf", "talk_title": "AI/ML study group 4992459 LB  784: SIGHUP, fixes with 24.0.129.2<\/li>\n<li>Run  504676, LB 384: Algorithm timeout (muon backtracking) : Increase timeout to 3h<\/li>\n<li>Run 504403 LB 578: Missing data in /TRIGGER/LUMI/LBLB: Give up, GLOBAL_OFFLINE_PROCESSING_PROBLEM defect)<\/li>\n<\/ul>\n<\/li>\n<li>A few merging problems required manual intervention by ADC experts (thanks!)<\/li>\n<\/ul>\n<\/li>\n<li>Status of mc23g production\n<ul>\n<li>Still significant backlog for mc production:\n<ul>\n<li>EVGEN - 24B (23B low priority MG FxFx)<\/li>\n<li>SIM -17B<\/li>\n<li>RECO-4B<\/li>\n<\/ul>\n<\/li>\n<li>mc23g status\n<ul>\n<li>High priority CP samples - finished<\/li>\n<li>SIM: 4.42B  (3.2 lower priority CP samples, 0.8 V+jets)<\/li>\n<li>RECO: 2.5B  (100 CP samples,2.4B V+jets high priority)<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>2025 data and MC Derivations ?   =&gt; Started for mc23g (DAOD_PHYS/PHYSLITE - for the high priority CP samples mostly ready, need also CP derivations) , should also launch derivation for data (need final container for physics_Main<\/li>\n<li>Simulation and Digitiuation\n<ul>\n<li>mc23g: Reconstruction of CP samples <a href=\"https://prodtask-dev.cern.ch/prodtask/inputlist_with_request/64837/\" target=\"_blank\" rel=\"noopener noreferrer\">ongoing<\/a><\/li>\n<li>AF3 as G4 fast simulation model\n<ul>\n<li>PhysVal (<a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1355\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1355<\/a>): Percent-level differences in Topoclusters and Neutral PFlow distributions considered acceptable by AF3 experts and, to our understanding, by the CP groups<\/li>\n<li>PhysVal (<a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1367\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1367<\/a>): Final validation comparing the new AF3 with Geant4 using the mc23g setup requested to assess the production readiness<\/li>\n<li>Could start production if this validation is OK (expected this week<\/li>\n<\/ul>\n<\/li>\n<li>Track-overlay\n<ul>\n<li>PhysVal (<a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1351\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1351<\/a>)\n<ul>\n<li>Observed differences are largely understood (primarily due to missing fake tracks) and have limited impact on high-level physics performance<\/li>\n<li>Signed off by several domains (Topoclusters, MET, Jets, Tau)<\/li>\n<li>Additional material on the Track-overlay methodology and ML-based event selection provided to help validators in the remaining domains<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>Physics validation\n<ul>\n<li>In addition to the PhysVal tasks for Simu+Digi (above), we are also currently working on\n<ul>\n<li>R25 validations — Latest validated: 25.0.59 (<a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1366\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1366<\/a>)<\/li>\n<li>ACTS validation campaign — <a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1354\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1354<\/a><\/li>\n<li>Validation of latest Geant4 patch — <a href=\"https://its.cern.ch/jira/browse/ATLPHYSVAL-1360\" target=\"_blank\" rel=\"noopener noreferrer\">ATLPHYSVAL-1360<\/a><\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>Status of release 24\n<ul>\n<li>Not a walking dead yet: Will be used for data26pp reprocessing (high and low mu), reprocessing of 2025 and 2026 HI data<\/li>\n<\/ul>\n<\/li>\n<li>PbPb data taking\n<ul>\n<li>0.77 nb-1 recorded so far<\/li>\n<\/ul>\n<\/li>\n<li>2026 pp data reprocessing\n<ul>\n<li>talk at alignment meeting  <a href=\"https://indico.cern.ch/event/1691849/contributions/7114050/attachments/3283503/5869517/SMarti_20260528.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">https://indico.cern.ch/event/1691849/contributions/7114050/attachments/3283503/5869517/SMarti_20260528.pdf<\/a><\/li>\n<li>Attempt to apply a quick-and-dirty fix for the alignment problem in period C and D\n<ul>\n<li>So far, the new alignment was only tested on the runs that were used to derive them.<\/li>\n<li>Fixes the sagitta-bias but not the d0 (with re-derived beam spot). Salva believes this is ok for Hmumu.\n<ul>\n<li>Would it impact d0/sigma cut ?  Could also impact ttH category but has small weigh<\/li>\n<li>Need to verify it works also on other runs (ongoing)<\/li>\n<\/ul>\n<\/li>\n<li>=&gt; a couple of checks needed before the “quick” reprocessing can be launched<\/li>\n<li>Proper fix requires re-playing the calibration loo<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>MC for 2026: no specific request yet to have a specific MC campaign. Baseline is to use the mc23g campaign.<\/li>\n<\/ul>\n<p>AI/ML study group status<\/p>\n<ul>\n<li>\n<p>Had semi regular study group meetings, plan weekly meetings in June to prepare ATLAS week report<\/p>\n<\/li>\n<li>\n<p><a href=\"https://twiki.cern.ch/twiki/pub/AtlasProtected/OfflineActivityCoordinationBoard/ATLAS_AI_ML_study_group_-_MANDATE.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Mandate<\/a>  expect to deliver:<\/p>\n<ul>\n<li>Proposed structure (if change required)<\/li>\n<li>Common tools<\/li>\n<li>Publication strategy<\/li>\n<li>Person power requirement<\/li>\n<li>Coordination /Training<\/li>\n<li>Efficient deployment of AI/ML<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Considered 10 focus areas (see slide 5), had also some discussions on impact of CERN AI strategy<\/p>\n<\/li>\n<li>\n<p>Two categories of AI/ML, may need different recommendations<\/p>\n<ul>\n<li>ATLAS domain specific models (event selection, reconstruction, calibration,..)<\/li>\n<li>LLMs and agents used by ATLAS<\/li>\n<li>Overlap ? =&gt; a bit of possible overlap, e.g chATLAS<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>ATLAS domain specific tools<\/p>\n<ul>\n<li>Interest to centralize framework for training / data handling/ validation (e.g SALT framework)<\/li>\n<li>Interest of feedback / advice from experts\n<ul>\n<li>Maybe more direct connection than in topical meetings of ML forum. Could use more “facilitators” of the current ML forum (with experts on various tools, similar organization as stat. forum ?) ?  Need to understand exactly what people want.\n<ul>\n<li>“close” meetings of committee would not work for AI/ML<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>Validation can take up to ~ year. Can some aspects be streamlined ?<\/li>\n<li>Need also to keep some flexibility<\/li>\n<li>Scaling and foundation models:\n<ul>\n<li>from FTAG studies, bigger models can still lead to improvements<\/li>\n<li>Foundation model: Learn more general features of data, encompassing many tasks =&gt; across CP groups, may need centralized effort, important questions on compute needs for training and inference.<\/li>\n<li>(Computing coord:) significant allocation but not ouf of reach.  (O(10000) GPU-hours “easy, could have O(100000) GPU-hours up to 300000 in some HPC); have to be careful to check large scale requests before the resources are allocated.   Overall for science projects, requests of ~1M GPU-hours are not rare.<\/li>\n<li>We need also to be able to benchmark these foundation models against dedicated tools + check against data.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>LLMs and agents<\/p>\n<ul>\n<li>Coding agents are becoming ubiquitous, important to develop guidelines (also including analysis software)<\/li>\n<li>Agentics LLC can orchestrate complex states, interest in operation and Data quality monitoring.   Full data analysis ?<\/li>\n<li>They are new technologies, unclear what can be built in common, but common infrastructure may be needed.<\/li>\n<li>Need critical exploration and evaluation\n<ul>\n<li>Dedicated task forces on specific targets ?<\/li>\n<\/ul>\n<\/li>\n<li>Need some thinking about possible organization<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Computing resources<\/p>\n<ul>\n<li>See discussion above in foundation model training<\/li>\n<li>Inference: big models also need GPU for efficient inference =&gt; need specific considerations  (inference as service, hardware, ..)<\/li>\n<li>Agent based running code may require more CPU resources ?<\/li>\n<li>Many founding decisions in sites being done until the start of run 4, may not have a lot of GPU hardware in grid sites in the next few years.<\/li>\n<li>Can possibly significantly change how we apply for computing resources. Challenging to fit in the current ways in which we ask for resources quite a bit in advance.   Would have to understand how to fit this in computing requirements. For instance, would it be more effective to have GPU resources at CERN than in different grid sides ? Currently Tier0 has no GPU resources.   HLT will bring significant GPU resources.  If we want O(10%) of pledge of GPU we have to be sure we use them since we will have then less CPU available (and we do need more compute for run 4)\n<ul>\n<li>Different detector at start of run 4, it will be necessary to understand how data is handled, not obvious to do if lots of AI/ML in reconstruction, 100% CPU on Tier0 may be better.<\/li>\n<li>Will probably anyway not go back to simpler models.  Should already think about what we will need.<\/li>\n<li>Cannot have just simple algorithms at the beginning of run 4.<\/li>\n<li>GN2/3 can run inference on CPU anyway.  But we need to study now what kind of GPU we will need in run 4.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Publications and open data<\/p>\n<ul>\n<li>Not really a policy change<\/li>\n<li>Sense that it is hard to have publication on AI/ML, make people aware of what is possible, clarify rules<\/li>\n<li>Would more limited author list publications be useful ?<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Connections to outside community<\/p>\n<ul>\n<li>AI for science is a hot topic across the world<\/li>\n<li>Several projects, significant funding available<\/li>\n<li>Support ATLAS collaborators in these efforts<\/li>\n<li>Contribute to CERN AI strategy ? would like opportunity to grow international collaboration<\/li>\n<li>Connections to industry ?<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Sustainability<\/p>\n<ul>\n<li>Equal access to AI models ?<\/li>\n<li>Impact of new hardware ?<\/li>\n<li>Code of conduct is important<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Towards a broadened AI/ML group ? (see slide 16)<\/p>\n<ul>\n<li>Stronger liaisons ?<\/li>\n<li>Cover Model R&amp;D and common framework, training and education<\/li>\n<li>Including ability to spin off dedicated task forces ?<\/li>\n<li>Need to balance centralization vs existing group activities.<\/li>\n<li>CMS has 3 subgroups for ML/AI: knowledge (documentation, ..), performance (common infrastructure,.. ) innovation (exploring new models,..)<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Further questions<\/p>\n<ul>\n<li>For models provided by outside, need some guidelines / validation on how to use that for things like analysis ?  Also data privacy is important. =&gt; should build benchmarks.  If using agents for operation we probably want to host them locally.  =&gt; links with Cern AI strategy<\/li>\n<li>Could we involve big companies ? =&gt; not discussed yet much in the study group.  Would the industry be interested ? =&gt; probably ATLAS/CERN carry some values.    We may profit from some expertise on agentic tools.\n<ul>\n<li>One example of that would be the usage of the indico dataset.<\/li>\n<\/ul>\n<\/li>\n<li>What is the figure of merit for improvements ? Should we for instance take into account the cost in the flavor tagging algorithm optimization =&gt; come back to the compute resources.<\/li>\n<li>Traditionally Tier0 resources are used for production not for training.<\/li>\n<li>Have probably to separate resources for training and inference.<\/li>\n<li>Include also some discussions of the concerns raised in the ATLAS week presentation<\/li>\n<li>Important to have a message on how to organize effort, and how to adapt to tools/algorithms  which are moving fast.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p>Next steps<\/p>\n<ul>\n<li>Presentation of preliminary recommendation + (guided) discussion at ATLAS week in June<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1693788", "type": "meeting", "title": "AI/ML Study Group - Sixth Meeting", "date": "2026-06-02", "important": true, "short_label": null, "summary_md": "[Link To Indico](https://indico.cern.ch/event/1693788/)\n\n[Template for presentation](https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28) (note, copy before modifying!)", "minutes_md": "# Meeting Summary\n\nThe discussion focused on how ATLAS should frame the value and cost of machine learning and LLM adoption, with several participants arguing against precise compute-versus-luminosity cost comparisons and instead emphasizing physics gains, usability improvements, and enabling new compute platforms such as GPUs and HPC centers. A major thread concerned LLM governance, including privacy, embargoed research data, credential handling, network constraints in the control room, and the risk of degraded internal services if agents and bots access tools like AMI, GitLab, Twiki, or Rucio at scale. Participants broadly agreed there is strong interest in evolving the machine learning forum into a more structured group, likely supported by task forces on analysis and operations, and that the collaboration needs experiment-wide guidelines, clearer advice channels, safer interfaces, and explicit deliverables aligned with the mandate. The group also discussed next-step planning for slides, publication strategy, ECSB input, recurring meetings, and possible external input from CMS on how their machine learning group is structured.\n\n## Themes\n\n- ML compute costs\n\n- Physics value of ML\n\n- GPU and HPC access\n\n- LLM privacy\n\n- Data governance\n\n- Credential security\n\n- Control room LLM use\n\n- Service reliability\n\n- Task forces\n\n- Group structure\n\n- Advice and liaisons\n\n- Mandate deliverables\n\n- Publication strategy\n\n- ECSB input\n\n- CMS ML group comparison\n\n## Action Items\n\n| Owner | Action | Quote |\n\n| --- | --- | --- |\n\n| Gordon T. Watts | Consider creating a task force to develop a computing model and a costing model for compute if large technologies are the direction the collaboration takes. | We will probably need a task force to do a computing model and a costing model for the compute. |\n\n| Michael Kagan | Develop collaboration guidelines for acceptable LLM use, including whether tools such as Rucio and Athena outputs are allowed. | We need guidelines. Maybe Rucio is fine, but the output of Athena, is that fine or not fine? We have to decide. |\n\n| Gordon T. Watts | Summarize the governance and policy discussion in a paragraph for the report. | This discussion can be summarized in a paragraph and put in the report: the collaboration needs to sit down and address this as a collaboration. |\n\n| Dan Guest | Define what counts as red data and plan compartmentalized access for agents instead of broad CERN SSO access. | We need a definition of red data... We need compartmentalized access to certain information that an agent is realistically going to need access to. |\n\n| Michael Kagan | Plan work over the next weeks around the mandate deliverables and structure slides accordingly. | We actually need to write all these things down... We need to plan the work around this... maybe writing our slides structured around these points. |\n\n| Michael Kagan | Hold a phone call with Gordon and begin emailing people to request contributions toward the deliverables. | Gordon and I need to have a phone call and then start emailing people to request that they do things. |\n\n| Robert Les | Return to the publication strategy deliverable, which has not yet been adequately discussed. | We should come back to that. |\n\n| Michael Kagan | Prepare a slide on publication strategy for the next meeting. | We should write a slide. Can you put together a few slides for the next meeting? |\n\n| Robert Les | Work with Dan Mernane to prepare slides on publication strategy and context from the machine learning forum for the next meeting. | Yeah, me and Dan Mernane can do this, because we can put the context up from the machine learning form. |\n\n| Michael Kagan | Invite ECSB to provide input, potentially as a short talk at the next meeting. | Do we want to have a talk from the ECSB in the next meeting, 10 min interest? |\n\n| Gordon T. Watts | Invite ECSB members attending Glasgow to the discussion there. | We should make sure the ECSB members who are there are invited to that. |\n\n| Michael Kagan | Define the structure of the ECSB discussion rather than leaving it fully open-ended. | As a group, we should define what the structure of that discussion is going to be. |\n\n| Michael Kagan | Coordinate a plan with Gordon for gathering inputs and organizing recommendations or suggestions. | Gordon, we need to make a plan for getting all this together or getting inputs from everyone. |\n\n| Michael Kagan | Follow up next week with publication strategy, invite the ECSB, and decide with Gordon what to do next week. | Rob, you'll follow up with a publication strategy next week. We'll invite the ECSB, and then Gordon and I will talk and decide what we're going to do next week. |\n\n| James Catmore | Hold another cross-cutting meeting before the next one to discuss concretely how the strengthened group should be organized. | We'll have another cross-cutting meeting before the next one. We need to discuss concretely how the organization of this strengthened group will work. |\n\n| Gordon T. Watts | Plan to meet every Tuesday for ongoing coordination. | Michael's suggestion that we just plan on meeting every Tuesday is a good one. |\n\n| Michael Kagan | Review the CMS machine learning group structure using the internal Twiki received from Javier Duarte. | I got Javier Duarte to send me the internal Twiki describing the structure of the CMS machine learning group, so we know what it's all about. |\n\n| Michael Kagan | Consider inviting a CMS representative to explain their machine learning group structure. | We could invite one of them to come and talk about it. |\n\n| Gordon T. Watts | Reach out to Mia Lu as a possible CMS speaker. | Mia Lu is one of the conveners. She might be willing to come and talk to us. |\n\n| Michael Kagan | Try to invite all three relevant CMS-related participants for short talks and discussions next week. | We could try to invite all three of these for short talks and discussions for next week. |\n\n| Gordon T. Watts | Start checking schedules for potential invited speakers. | We have to figure out people's schedules, but we should start that. |\n\n## External Resources\n\n| Resource | Type | Context |\n\n| --- | --- | --- |\n\n| WLCG | compute resource | Referenced in discussion of overall available compute resources across the four experiments. |\n\n| ATLAS resources | compute resource | Michael Kagan cited a rough figure of half a million ATLAS resources. |\n\n| GPU rack at 0.1 | hardware proposal | Raised as a possible local hosting option for LLMs near detector/control-room operations. |\n\n| Inference as a service | service model | Suggested as likely needed if large technologies are adopted. |\n\n| Rucio | data management tool | Used as an example in policy discussions about what LLMs or agents should be allowed to access. |\n\n| Athena | software framework | Its output was discussed as a specific example needing guidance on whether it can be shared with LLMs. |\n\n| AMI | metadata/service system | Raised as a fragile service that could suffer from heavy bot or agent query loads. |\n\n| PyAMI | client tool | Mentioned as capable of causing AMI slowdowns with badly phrased queries. |\n\n| Twiki | documentation platform | Mentioned in relation to scraping difficulties and CERN's internal version. |\n\n| GitLab | code hosting platform | Discussed as a service that could degrade if many bots continuously access it. |\n\n| GitHub token model | access control example | Presented as a model for reduced-permission tokens for agents. |\n\n| CERN single sign-on | authentication system | Raised as a risky credential source if agents are given broad access. |\n\n| Claude | LLM service | Mentioned in concerns about embargoed research outputs and current computer-use capabilities. |\n\n| OpenAI | LLM provider | Referenced in both compute-scaling analogies and hosted model/tool access. |\n\n| Mistral | LLM provider | Mentioned as part of CERN's possible AI partnerships. |\n\n| Anthropic | LLM provider | Mentioned as part of CERN's possible AI partnerships. |\n\n| Claude work | agent/tooling capability | Mentioned as an example of downloadable tooling that can use a computer and browser. |\n\n| Codex | agent/tooling capability | Mentioned alongside Claude and OpenAI computer-use tools. |\n\n| Internal Twiki describing the CMS machine learning group structure | documentation | Sent by Javier Duarte to help compare CMS and ATLAS ML group organization. |\n\n| CMS machine learning group | organizational model | Discussed as a structure ATLAS could learn from, despite limited visibility of its tools and recommendations. |\n\n| ECSB | committee/group | Potential source of input via a short talk at the next meeting. |\n\n| HPC centers | compute infrastructure | Mentioned as newly accessible if reconstruction uses GPUs. |\n\n| Institute-hosted GPT instance in Scandinavia | hosted LLM deployment | James Catmore described a university-paid cloud deployment that permits yellow data but not red data. |\n\n| UW LLM instance | hosted LLM deployment | Mentioned as a web-only interface without API access for CLI or IDE tools. |\n\n## Talk Highlights\n\n### Dan Guest\n\nSalient points:\n\n- Argued that training is not always dramatically more expensive than inference, especially for one-pass training.\n\n- Asked when compute spending exceeds the value returned by ML improvements.\n\n- Suggested comparing ML benefit to equivalent additional LHC running time, while arguing the field is still far from that threshold.\n\n- Questioned latency and locality requirements for control-room LLM deployment.\n\n- Distinguished between optional productivity aids and operationally essential LLM agents.\n\n- Warned that overly restrictive LLM rules may be widely ignored.\n\n- Emphasized credential risk and the need for red-data definitions and compartmentalized access.\n\nQuestions:\n\n- If we could get effectively one inverse femtobarn of extra luminosity out of the LHC by doing some kind of machine learning algorithm, how much is that worth?\n\n- What are the latency requirements?\n\n- Does it have to be at 0.1 or anything like that?\n\n- Is it completely air-gapped? There's no external internet at all?\n\n- Is anyone actually planning on having agents that are an essential part of the run, or is it mostly as debugging aids and to set up things?\n\n- How much of an advantage do we hand to people who do not comply with our guidelines?\n\n### Michael Kagan\n\nSalient points:\n\n- Stated that training can be substantially more expensive than inference depending on epochs and backpropagation.\n\n- Reported little pushback on evolving the ML forum into a group.\n\n- Said many people want advice and that the collaboration needs better ways to expose advisory channels.\n\n- Summarized broad support for task forces and stronger structure.\n\n- Argued CERN is unlikely to build its own LLM but could obtain hosted access.\n\n- Highlighted the need for practical guidelines on LLM use that match what people will actually do.\n\n- Stressed that the mandate already defines deliverables and that the group must align its work to them.\n\n- Proposed external input from ECSB and CMS and recurring organizational planning.\n\nQuestions:\n\n- The question is how we structure or get out the knowledge that you can come and get advice, because people want it and we have to figure out how to do it better.\n\n- Do we want to have a talk from the ECSB in the next meeting, 10 min interest?\n\n- I don't know who's going to be there.\n\n### Gordon T. Watts\n\nSalient points:\n\n- Rejected precise cost-accounting arguments for ML adoption as too difficult and incomplete.\n\n- Emphasized knock-on benefits such as GPU-enabled access to HPC centers.\n\n- Suggested future need for inference as a service and a compute/costing task force.\n\n- Argued for framing recommendations around improved physics and easier day-to-day analysis rather than exact cost comparisons.\n\n- Pushed back on premature infrastructure planning for control-room LLMs before demonstrating usefulness.\n\n- Advocated experiment-wide policy, safer access controls, and reduced-permission token models.\n\n- Warned that agentic computer use is already real and security/human factors must be addressed.\n\n- Suggested efficient machine-facing interfaces to avoid service abuse and supported building common skills/tools.\n\n- Focused on aligning outputs with recommendations, report structure, meeting planning, and external engagement.\n\nQuestions:\n\n- Have we actually shown that they will help with our data acquisition yet?\n\n- When we are doing physics analysis, detector operations, admin stuff, what kinds of data are we dealing with?\n\n### James Catmore\n\nSalient points:\n\n- Argued that comparing ML compute to LHC running costs is a false comparison because data taking will continue regardless.\n\n- Raised broader concern about offsite-hosted LLMs and noted a middle path via institution-paid regional cloud hosting.\n\n- Explained local data classifications allowing yellow data but not red data in the institute-hosted GPT environment.\n\n- Clarified that Rucio concerns are more about credential delegation than dataset names.\n\n- Warned that even read-only bots can overload services such as Twiki, GitLab, and especially AMI.\n\n- Said publication strategy has not been adequately discussed and should be revisited.\n\n- Called for another cross-cutting meeting to discuss how the strengthened group should work.\n\nQuestions:\n\n- Isn't this making a false comparison?\n\n- I am wondering if this is something other institutes do, and maybe it is a model for CERN.\n\n### Joaquin Hoya\n\nSalient points:\n\n- Estimated data-taking costs and linked one day of running to roughly one inverse femtobarn.\n\n- Reported privacy concerns around LLMs from detector-quality and run coordinators.\n\n- Said local GPU hosting near point 1 had been suggested but funding and physical placement are unresolved.\n\n- Reported strong control-room interest in an LLM assistant for shifters.\n\n- Explained that control-room desktops are limited to the internal network.\n\n- Observed that some people are trying to use LLMs to compensate for underlying infrastructure problems.\n\n### Robert Les\n\nSalient points:\n\n- Clarified that the control-room environment is not fully isolated but should be able to disconnect externally if needed.\n\n- Noted that publication strategy has been largely absent from recent discussions.\n\n- Volunteered with Dan Mernane to prepare publication-strategy slides with ML forum context.\n\n- Mentioned prior CMS cross-sharing discussions and the value of hearing directly from CMS about structural differences.", "participants": [], "tags": [], "documents": [{"label": "2026-06-02 - Meeting.cleaned.md", "url": "https://indico.cern.ch/event/1693788/attachments/3296640/5895999/2026-06-02%20-%20Meeting.cleaned.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-02 - Meeting.focus-areas.md", "url": "https://indico.cern.ch/event/1693788/attachments/3296640/5896001/2026-06-02%20-%20Meeting.focus-areas.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-02 - Meeting.summary.md", "url": "https://indico.cern.ch/event/1693788/attachments/3296640/5896002/2026-06-02%20-%20Meeting.summary.md", "talk_title": null, "speaker_names": []}], "contribu mmary<\/h1>\n<p>The discussion focused on how ATLAS should frame the value and cost of machine learning and LLM adoption, with several participants arguing against precise compute-versus-luminosity cost comparisons and instead emphasizing physics gains, usability improvements, and enabling new compute platforms such as GPUs and HPC centers. A major thread concerned LLM governance, including privacy, embargoed research data, credential handling, network constraints in the control room, and the risk of degraded internal services if agents and bots access tools like AMI, GitLab, Twiki, or Rucio at scale. Participants broadly agreed there is strong interest in evolving the machine learning forum into a more structured group, likely supported by task forces on analysis and operations, and that the collaboration needs experiment-wide guidelines, clearer advice channels, safer interfaces, and explicit deliverables aligned with the mandate. The group also discussed next-step planning for slides, publication strategy, ECSB input, recurring meetings, and possible external input from CMS on how their machine learning group is structured.<\/p>\n<h2>Themes<\/h2>\n<ul>\n<li>\n<p>ML compute costs<\/p>\n<\/li>\n<li>\n<p>Physics value of ML<\/p>\n<\/li>\n<li>\n<p>GPU and HPC access<\/p>\n<\/li>\n<li>\n<p>LLM privacy<\/p>\n<\/li>\n<li>\n<p>Data governance<\/p>\n<\/li>\n<li>\n<p>Credential security<\/p>\n<\/li>\n<li>\n<p>Control room LLM use<\/p>\n<\/li>\n<li>\n<p>Service reliability<\/p>\n<\/li>\n<li>\n<p>Task forces<\/p>\n<\/li>\n<li>\n<p>Group structure<\/p>\n<\/li>\n<li>\n<p>Advice and liaisons<\/p>\n<\/li>\n<li>\n<p>Mandate deliverables<\/p>\n<\/li>\n<li>\n<p>Publication strategy<\/p>\n<\/li>\n<li>\n<p>ECSB input<\/p>\n<\/li>\n<li>\n<p>CMS ML group comparison<\/p>\n<\/li>\n<\/ul>\n<h2>Action Items<\/h2>\n<p>| Owner | Action | Quote |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| Gordon T. Watts | Consider creating a task force to develop a computing model and a costing model for compute if large technologies are the direction the collaboration takes. | We will probably need a task force to do a computing model and a costing model for the compute. |<\/p>\n<p>| Michael Kagan | Develop collaboration guidelines for acceptable LLM use, including whether tools such as Rucio and Athena outputs are allowed. | We need guidelines. Maybe Rucio is fine, but the output of Athena, is that fine or not fine? We have to decide. |<\/p>\n<p>| Gordon T. Watts | Summarize the governance and policy discussion in a paragraph for the report. | This discussion can be summarized in a paragraph and put in the report: the collaboration needs to sit down and address this as a collaboration. |<\/p>\n<p>| Dan Guest | Define what counts as red data and plan compartmentalized access for agents instead of broad CERN SSO access. | We need a definition of red data... We need compartmentalized access to certain information that an agent is realistically going to need access to. |<\/p>\n<p>| Michael Kagan | Plan work over the next weeks around the mandate deliverables and structure slides accordingly. | We actually need to write all these things down... We need to plan the work around this... maybe writing our slides structured around these points. |<\/p>\n<p>| Michael Kagan | Hold a phone call with Gordon and begin emailing people to request contributions toward the deliverables. | Gordon and I need to have a phone call and then start emailing people to request that they do things. |<\/p>\n<p>| Robert Les | Return to the publication strategy deliverable, which has not yet been adequately discussed. | We should come back to that. |<\/p>\n<p>| Michael Kagan | Prepare a slide on publication strategy for the next meeting. | We should write a slide. Can you put together a few slides for the next meeting? |<\/p>\n<p>| Robert Les | Work with Dan Mernane to prepare slides on publication strategy and context from the machine learning forum for the next meeting. | Yeah, me and Dan Mernane can do this, because we can put the context up from the machine learning form. |<\/p>\n<p>| Michael Kagan | Invite ECSB to provide input, potentially as a short talk at the next meeting. | Do we want to have a talk from the ECSB in the next meeting, 10 min interest? |<\/p>\n<p>| Gordon T. Watts | Invite ECSB members attending Glasgow to the discussion there. | We should make sure the ECSB members who are there are invited to that. |<\/p>\n<p>| Michael Kagan | Define the structure of the ECSB discussion rather than leaving it fully open-ended. | As a group, we should define what the structure of that discussion is going to be. |<\/p>\n<p>| Michael Kagan | Coordinate a plan with Gordon for gathering inputs and organizing recommendations or suggestions. | Gordon, we need to make a plan for getting all this together or getting inputs from everyone. |<\/p>\n<p>| Michael Kagan | Follow up next week with publication strategy, invite the ECSB, and decide with Gordon what to do next week. | Rob, you'll follow up with a publication strategy next week. We'll invite the ECSB, and then Gordon and I will talk and decide what we're going to do next week. |<\/p>\n<p>| James Catmore | Hold another cross-cutting meeting before the next one to discuss concretely how the strengthened group should be organized. | We'll have another cross-cutting meeting before the next one. We need to discuss concretely how the organization of this strengthened group will work. |<\/p>\n<p>| Gordon T. Watts | Plan to meet every Tuesday for ongoing coordination. | Michael's suggestion that we just plan on meeting every Tuesday is a good one. |<\/p>\n<p>| Michael Kagan | Review the CMS machine learning group structure using the internal Twiki received from Javier Duarte. | I got Javier Duarte to send me the internal Twiki describing the structure of the CMS machine learning group, so we know what it's all about. |<\/p>\n<p>| Michael Kagan | Consider inviting a CMS representative to explain their machine learn <\/p>\n<\/li>\n<li>\n<p>Asked when compute spending exceeds the value returned by ML improvements.<\/p>\n<\/li>\n<li>\n<p>Suggested comparing ML benefit to equivalent additional LHC running time, while arguing the field is still far from that threshold.<\/p>\n<\/li>\n<li>\n<p>Questioned latency and locality requirements for control-room LLM deployment.<\/p>\n<\/li>\n<li>\n<p>Distinguished between optional productivity aids and operationally essential LLM agents.<\/p>\n<\/li>\n<li>\n<p>Warned that overly restrictive LLM rules may be widely ignored.<\/p>\n<\/li>\n<li>\n<p>Emphasized credential risk and the need for red-data definitions and compartmentalized access.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>If we could get effectively one inverse femtobarn of extra luminosity out of the LHC by doing some kind of machine learning algorithm, how much is that worth?<\/p>\n<\/li>\n<li>\n<p>What are the latency requirements?<\/p>\n<\/li>\n<li>\n<p>Does it have to be at 0.1 or anything like that?<\/p>\n<\/li>\n<li>\n<p>Is it completely air-gapped? There's no external internet at all?<\/p>\n<\/li>\n<li>\n<p>Is anyone actually planning on having agents that are an essential part of the run, or is it mostly as debugging aids and to set up things?<\/p>\n<\/li>\n<li>\n<p>How much of an advantage do we hand to people who do not comply with our guidelines?<\/p>\n<\/li>\n<\/ul>\n<h3>Michael Kagan<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Stated that training can be substantially more expensive than inference depending on epochs and backpropagation.<\/p>\n<\/li>\n<li>\n<p>Reported little pushback on evolving the ML forum into a group.<\/p>\n<\/li>\n<li>\n<p>Said many people want advice and that the collaboration needs better ways to expose advisory channels.<\/p>\n<\/li>\n<li>\n<p>Summarized broad support for task forces and stronger structure.<\/p>\n<\/li>\n<li>\n<p>Argued CERN is unlikely to build its own LLM but could obtain hosted access.<\/p>\n<\/li>\n<li>\n<p>Highlighted the need for practical guidelines on LLM use that match what people will actually do.<\/p>\n<\/li>\n<li>\n<p>Stressed that the mandate already defines deliverables and that the group must align its work to them.<\/p>\n<\/li>\n<li>\n<p>Proposed external input from ECSB and CMS and recurring organizational planning.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>The question is how we structure or get out the knowledge that you can come and get advice, because people want it and we have to figure out how to do it better.<\/p>\n<\/li>\n<li>\n<p>Do we want to have a talk from the ECSB in the next meeting, 10 min interest?<\/p>\n<\/li>\n<li>\n<p>I don't know who's going to be there.<\/p>\n<\/li>\n<\/ul>\n<h3>Gordon T. Watts<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Rejected precise cost-accounting arguments for ML adoption as too difficult and incomplete.<\/p>\n<\/li>\n<li>\n<p>Emphasized knock-on benefits such as GPU-enabled access to HPC centers.<\/p>\n<\/li>\n<li>\n<p>Suggested future need for inference as a service and a compute/costing task force.<\/p>\n<\/li>\n<li>\n<p>Argued for framing recommendations around improved physics and easier day-to-day analysis rather than exact cost comparisons.<\/p>\n<\/li>\n<li>\n<p>Pushed back on premature infrastructure planning for control-room LLMs before demonstrating usefulness.<\/p>\n<\/li>\n<li>\n<p>Advocated experiment-wide policy, safer access controls, and reduced-permission token models.<\/p>\n<\/li>\n<li>\n<p>Warned that agentic computer use is already real and security/human factors must be addressed.<\/p>\n<\/li>\n<li>\n<p>Suggested efficient machine-facing interfaces to avoid service abuse and supported building common skills/tools.<\/p>\n<\/li>\n<li>\n<p>Focused on aligning outputs with recommendations, report structure, meeting planning, and external engagement.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Have we actually shown that they will help with our data acquisition yet?<\/p>\n<\/li>\n<li>\n<p>When we are doing physics analysis, detector operations, admin stuff, what kinds of data are we dealing with?<\/p>\n<\/li>\n<\/ul>\n<h3>James Catmore<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued that comparing ML compute to LHC running costs is a false comparison because data taking will continue regardless.<\/p>\n<\/li>\n<li>\n<p>Raised broader concern about offsite-hosted LLMs and noted a middle path via institution-paid regional cloud hosting.<\/p>\n<\/li>\n<li>\n<p>Explained local data classifications allowing yellow data but not red data in the institute-hosted GPT environment.<\/p>\n<\/li>\n<li>\n<p>Clarified that Rucio concerns are more about credential delegation than dataset names.<\/p>\n<\/li>\n<li>\n<p>Warned that even read-only bots can overload services such as Twiki, GitLab, and especially AMI.<\/p>\n<\/li>\n<li>\n<p>Said publication strategy has not been adequately discussed and should be revisited.<\/p>\n<\/li>\n<li>\n<p>Called for another cross-cutting meeting to discuss how the strengthened group should work.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Isn't this making a false comparison?<\/p>\n<\/li>\n<li>\n<p>I am wondering if this is something other institutes do, and maybe it is a model for CERN.<\/p>\n<\/li>\n<\/ul>\n<h3>Joaquin Hoya<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Estimated data-taking costs and linked one day of running to roughly one inverse femtobarn.<\/p>\n<\/li>\n<li>\n<p>Reported privacy concerns around LLMs from detector-quality and run coordinators.<\/p>\n<\/li>\n<li>\n<p>Said local GPU hosting near point 1 had been suggested but funding and physical placement are unresolved.<\/p>\n<\/li>\n<li>\n<p>Reported strong control-room interest in an LLM assistant for shifters.<\/p>\n<\/li>\n<li>\n<p>Explained that control-room desktops are limited to the internal network.<\/p>\n<\/li>\n<li>\n<p>Observed that some people are trying to use LLMs to compensate for underlying infrastructure problems.<\/p>\n<\/li>\n<\/ul>\n<h3>Robert Les<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Clarified that the control-room environment is not fully isolated but should be able to disconnect externally if needed.<\/p>\n<\/li>\n<li>\n<p>Noted that publication strategy has been largely absent from recent discussions.<\/p>\n<\/li>\n<li>\n<p>Volunteered with Dan Mernane to prepare publication-strategy slides with ML forum context.<\/p>\n<\/li>\n<li>\n<p>Mentioned prior CMS cross-sharing discussions and the value of hearing directly from CMS about structural differences.<\/p>\n<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1697047", "type": "meeting", "title": "AI/ML Study Group - Seventh Meeting", "date": "2026-06-09", "important": true, "short_label": "Discussion Towards Recommendations Development", "summary_md": "[Link To Indico](https://indico.cern.ch/event/1697047/)\n\n[Template for presentation](https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28) (note, copy before modifying!)", "minutes_md": "# Meeting Summary\n\nThe discussion focused on how ATLAS should strengthen machine-learning-related publications, organization, and training. Robert outlined strong community demand for more ML-focused papers, faster publication routes, and clearer guidance on what counts as ML work versus physics or performance work, noting current ambiguity, political blockers, and limited visibility when papers remain in traditional HEP channels. Several participants supported creating a formal ML group or working group to provide a clearer publication path, host sister papers with analyses, maintain cross-group coordination, and own useful shared infrastructure such as frameworks, benchmarks, and training utilities. At the same time, participants emphasized that ATLAS should not chase publication volume at the expense of quality, and that review speed will still depend on the scope of claims, especially when detector or physics performance is involved. The conversation broadened to student career development, grant competitiveness, ML onboarding, and training resources, with suggestions to combine ATLAS-specific tutorials with broader community material from HSF and CERN. Participants also discussed how to handle cross-cutting areas such as operations, detector applications, and agentic or LLM-based workflows, with no final decision on whether those belong in an ML group, software/computing structures, or a separate task force. Overall, the group converged on the need for clearer publication guidelines, stronger coordination structures, practical shared tools, and a more intentional training and support model.\n\n## Themes\n\n- ML publications\n\n- Publication policy\n\n- ML working group\n\n- Cross-group coordination\n\n- Student career development\n\n- Grant competitiveness\n\n- Training and tutorials\n\n- Shared ML infrastructure\n\n- Operations and detector applications\n\n- LLMs and agents\n\n- ATLAS-specific onboarding\n\n- Journal strategy\n\n## Action Items\n\n| Owner | Action | Quote |\n\n| --- | --- | --- |\n\n| Robert Les | Robert and Dan will speak with PubCom on Thursday to get feedback and opinions on ML publications. | Dan and I will chat with PubCom on Thursday to get their feedback and opinions. |\n\n| James Catmore | Share the HSF training hub deep learning for particle physics course link in the chat. | I'm going to post this link now, then people can see what I'm talking about. |\n\n| Michael Kagan | Michael and Gordon will synthesize the meeting input into a proposal or recommendations for the group to review. | Gordon and I are going to take all this input, synthesize something, and then you all are going to have to decide if you're happy or not. |\n\n| Michael Kagan | Continue the discussion next week and invite additional feedback from participants. | We'll maybe try to do the same thing next week. If you have any other feedback, please ping us. |\n\n| Dan Guest | Participants should post any material they actually covered to support follow-up and structuring discussions. | It would be nice if people posted any material that they actually did cover. |\n\n| Robert Les | Follow up on the previously discussed to-do item of minimal ML tutorial or training support. | Dan, we had talked with the people on this in the past, so it was on our to-do list. It's a very minimal case we can always address. |\n\n## External Resources\n\n| Resource | Type | Context |\n\n| --- | --- | --- |\n\n| ATLAS pub note | publication format | Discussed as a faster internal publication route for ML work, though pub notes do not currently go on arXiv. |\n\n| arXiv | preprint platform | Raised as a desired venue for ML visibility; participants discussed whether ATLAS pub notes could be posted there. |\n\n| NeurIPS | conference | Mentioned as a potential target venue for a transfer learning result, possibly first as a proceeding. |\n\n| HSF training hub | training resource | Suggested as a shared cross-experiment training platform rather than building all training materials inside ATLAS. |\n\n| Deep learning for particle physics course | course | Identified by James as existing material already available through the HSF training hub. |\n\n| ATLAS Lectures | training event | Described as the closest current ATLAS offering for ML-focused training, with a few ML-centered lectures each year. |\n\n| ML workshop | training event | Current venue with a few tutorials each year, but described as ad hoc rather than onboarding. |\n\n| Software Week | event | Suggested as a possible host for ML tutorials or a satellite training session. |\n\n| SALT | framework/tool | Presented as a successful example of shared ML infrastructure that could anchor a real working group with concrete responsibilities. |\n\n| Athena | software framework | Referenced in the context of teaching people how to integrate ML methods and objects into ATLAS software workflows. |\n\n| ONNX | model format/tool | Mentioned as one of the mainstream topics included in current tutorials. |\n\n| GPUs on the grid | computing topic | Mentioned as a recurring ML/computing tutorial theme. |\n\n| CERN AI strategy | strategy/framework | Suggested as a broader institutional direction that ATLAS training and ML support could connect to. |\n\n| FML school | training program | Mentioned by Daniel as a useful hybrid model with both open and ATLAS-specific components. |\n\n| Chatlists | tool/project | Used as an example of a semi-official shared effort that attracted contributors because it had a concrete day-to-day purpose. |\n\n| GitLab | development platform | Raised in discussion of whether AI agents should be allowed to operate there. |\n\n| RAG database | technical approach | Mentioned as part of ATLAS-specific LLM interaction and knowledge tooling. |\n\n| MCPs | technical tooling | Raised in the context of implementing orchestrated agent workflows. |\n\n| GN3 pub note | publication | Referenced as a related publication whose timing affected another ML pub note discussion. |\n\n| NSBI paper | paper | Referenced as an example of an ML-related soft publication with an unclear route through ATLAS structures. |\n\n| CMS ML group structure | organizational model | Discussed as a comparison point, including subgroups for knowledge, production, and innovation. |\n\n## Talk Highlights\n\n### Robert Les\n\nSalient points:\n\n- Reported broad support for publishing more ML-focused ATLAS papers.\n\n- Argued that ATLAS publication speed and venue choices are misaligned with ML career expectations and visibility.\n\n- Described ambiguity over what counts as ATLAS ML work versus physics or performance work.\n\n- Explained that ML pub notes have been faster but face policy and political obstacles, including arXiv limitations and overlap with other groups.\n\n- Said ATLAS needs clearer guidance and publication strategy, especially if the ML forum becomes a working group.\n\n- Mentioned potential follow-up work such as a transfer learning result for NeurIPS.\n\n- Highlighted concern that ATLAS may be underrepresented in HEP/ML job spaces.\n\nQuestions:\n\n- Whether pub notes could be put on arXiv.\n\n- How to define what is ML work versus physics/performance work.\n\n- How a future ML group should be structured and where its boundaries should lie.\n\n### Verena Ingrid Martinez Outschoorn\n\nSalient points:\n\n- Supported creating a clear publication path for ML papers.\n\n- Shared experience of confusion around the process for simulation-based inference work and soft publication.\n\n- Emphasized that publication expectations in data science PhD programs are often incompatible with current ATLAS output rates.\n\n- Suggested ATLAS tutorials could help establish good ML practices and common tooling.\n\n- Asked for more specificity on possible ML group organization.\n\n- Raised upgrade and detector concerns, especially around dependencies, integration, and support for new systems.\n\n- Argued for a centralized way to address some agentic workflow and operations issues.\n\nQuestions:\n\n- What exactly would a strengthened ML group look like organizationally?\n\n- How should ATLAS support detector and operations use cases for ML?\n\n- Should there be a centralized structure or task force for agentic workflows and related policies?\n\n### Michael Kagan\n\nSalient points:\n\n- Strongly suggested the group will likely recommend a machine learning group.\n\n- Argued that sister papers to analysis papers are likely the easiest publication case.\n\n- Pushed back on framing all publication blockers as politics, citing concerns about self-scooping and respecting overlapping work.\n\n- Warned against aiming for high ML paper volume at the expense of quality or ATLAS's mission.\n\n- Questioned whether ATLAS should be expected to train AI researchers for external industry roles.\n\n- Explored possible ML group roles in hosting papers, building shared tools, organizing tutorials, and handling cross-cutting model R&D.\n\n- Discussed whether agentic frameworks belong in an ML group or elsewhere.\n\n- Committed to synthesizing the input into a proposal.\n\nQuestions:\n\n- Do we actually have evidence about ATLAS people getting HEP/ML jobs versus CMS people?\n\n- What can ATLAS reasonably do for ML training without overcommitting resources?\n\n- How should model development responsibilities be delineated between an ML group and CP/physics groups?\n\n- Where should agentic workflow development live organizationally?\n\n### Daniel Murnane\n\nSalient points:\n\n- Argued that grants may be a particularly strong case for more methodological ML output because paper counts matter.\n\n- Reported current ATLAS ML training is ad hoc, with a few lectures and workshop tutorials but no real onboarding.\n\n- Suggested ML tutorials could be attached to existing events like Software Week.\n\n- Supported a hybrid training model combining general open material with ATLAS-specific closed sessions.\n\n- Described the central challenge of delineating what lives in an ML group versus CP groups as the 'million dollar question.'\n\n- Emphasized that a real group needs concrete responsibilities and shared infrastructure to maintain, using SALT as an example.\n\n- Argued that implementation expertise for LLM/agentic tooling should live somewhere concrete, likely in ML or software.\n\nQuestions:\n\n- Would training belong in software induction or a broader ATLAS onboarding process?\n\n- How should ATLAS argue for publishing methods before full physics exploitation?\n\n- Where should the experts who implement Atlas-specific agent tooling live?\n\n### James Catmore\n\nSalient points:\n\n- Noted that HEP is unusual in relying on thesis monographs rather than multiple authored papers, which limits individual visibility.\n\n- Agreed that an ML group producing ML papers is the right direction, but cautioned that full review will not make papers faster.\n\n- Linked the discussion to broader concerns about preparing students for diverse careers outside HEP.\n\n- Suggested leveraging external training resources like the HSF training hub rather than building everything inside ATLAS.\n\n- Supported connecting with the CERN AI strategy.\n\n- Argued that some agent and LLM policy questions likely belong in software coordination, computing, or PubCom rather than an ML group.\n\nQuestions:\n\n- How should ATLAS help prepare students for a changing workplace when most will not remain in HEP?\n\n- Should ATLAS rely more on shared community training infrastructure?\n\n- Which organizational bodies should own AI agent policy questions?\n\n### Bertrand Martin Dit Latour\n\nSalient points:\n\n- Asked whether ATLAS currently has ML-specific training events comparable to software induction or onboarding.\n\nQuestions:\n\n- Do we have in Atlas training events in machine learning as we have for other things like Atlas software or induction days?\n\n- Do the students learn this by going to dedicated schools or at their universities?\n\n### Dan Guest\n\nSalient points:\n\n- Asked participants to share materials they covered.\n\n- Suggested making better use of existing groups rather than automatically creating more groups.\n\n- Asked how the discussion will actually be turned into something actionable.\n\nQuestions:\n\n- What about structuring not the machine learning group?\n\n- What is the plan to actually turn this stuff into anything?", "participants": [], "tags": [], "documents": [{"label": "2026-06-09 - ML Publications.pdf", "url": "https://indico.cern.ch/event/1697047/contributions/7136587/attachments/3291657/5885878/2026-06-09%20-%20ML%20Publications.pdf", "talk_title": "Discussion Towards Recommendations Development", "speaker_names": []}, {"label": "2026-06-09 - Meeting.cleaned.md", "url": "https://indico.cern.ch/event/1697047/attachments/3292028/5895991/2026-06-09%20-%20Meeting.cleaned.md", "t
