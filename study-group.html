s to combine ATLAS-specific tutorials with broader community material from HSF and CERN. Participants also discussed how to handle cross-cutting areas such as operations, detector applications, and agentic or LLM-based workflows, with no final decision on whether those belong in an ML group, software/computing structures, or a separate task force. Overall, the group converged on the need for clearer publication guidelines, stronger coordination structures, practical shared tools, and a more intentional training and support model.<\/p>\n<h2>Themes<\/h2>\n<ul>\n<li>\n<p>ML publications<\/p>\n<\/li>\n<li>\n<p>Publication policy<\/p>\n<\/li>\n<li>\n<p>ML working group<\/p>\n<\/li>\n<li>\n<p>Cross-group coordination<\/p>\n<\/li>\n<li>\n<p>Student career development<\/p>\n<\/li>\n<li>\n<p>Grant competitiveness<\/p>\n<\/li>\n<li>\n<p>Training and tutorials<\/p>\n<\/li>\n<li>\n<p>Shared ML infrastructure<\/p>\n<\/li>\n<li>\n<p>Operations and detector applications<\/p>\n<\/li>\n<li>\n<p>LLMs and agents<\/p>\n<\/li>\n<li>\n<p>ATLAS-specific onboarding<\/p>\n<\/li>\n<li>\n<p>Journal strategy<\/p>\n<\/li>\n<\/ul>\n<h2>Action Items<\/h2>\n<p>| Owner | Action | Quote |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| Robert Les | Robert and Dan will speak with PubCom on Thursday to get feedback and opinions on ML publications. | Dan and I will chat with PubCom on Thursday to get their feedback and opinions. |<\/p>\n<p>| James Catmore | Share the HSF training hub deep learning for particle physics course link in the chat. | I'm going to post this link now, then people can see what I'm talking about. |<\/p>\n<p>| Michael Kagan | Michael and Gordon will synthesize the meeting input into a proposal or recommendations for the group to review. | Gordon and I are going to take all this input, synthesize something, and then you all are going to have to decide if you're happy or not. |<\/p>\n<p>| Michael Kagan | Continue the discussion next week and invite additional feedback from participants. | We'll maybe try to do the same thing next week. If you have any other feedback, please ping us. |<\/p>\n<p>| Dan Guest | Participants should post any material they actually covered to support follow-up and structuring discussions. | It would be nice if people posted any material that they actually did cover. |<\/p>\n<p>| Robert Les | Follow up on the previously discussed to-do item of minimal ML tutorial or training support. | Dan, we had talked with the people on this in the past, so it was on our to-do list. It's a very minimal case we can always address. |<\/p>\n<h2>External Resources<\/h2>\n<p>| Resource | Type | Context |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| ATLAS pub note | publication format | Discussed as a faster internal publication route for ML work, though pub notes do not currently go on arXiv. |<\/p>\n<p>| arXiv | preprint platform | Raised as a desired venue for ML visibility; participants discussed whether ATLAS pub notes could be posted there. |<\/p>\n<p>| NeurIPS | conference | Mentioned as a potential target venue for a transfer learning result, possibly first as a proceeding. |<\/p>\n<p>| HSF training hub | training resource | Suggested as a shared cross-experiment training platform rather than building all training materials inside ATLAS. |<\/p>\n<p>| Deep learning for particle physics course | course | Identified by James as existing material already available through the HSF training hub. |<\/p>\n<p>| ATLAS Lectures | training event | Described as the closest current ATLAS offering for ML-focused training, with a few ML-centered lectures each year. |<\/p>\n<p>| ML workshop | training event | Current venue with a few tutorials each year, but described as ad hoc rather than onboarding. |<\/p>\n<p>| Software Week | event | Suggested as a possible host for ML tutorials or a satellite training session. |<\/p>\n<p>| SALT | framework/tool | Presented as a successful example of shared ML infrastructure that could anchor a real working group with concrete responsibilities. |<\/p>\n<p>| Athena | software framework | Referenced in the context of teaching people how to integrate ML methods and objects into ATLAS software workflows. |<\/p>\n<p>| ONNX | model format/tool | Mentioned as one of the mainstream topics included in current tutorials. |<\/p>\n<p>| GPUs on the grid | computing topic | Mentioned as a recurring ML/computing tutorial theme. |<\/p>\n<p>| CERN AI strategy | strategy/framework | Suggested as a broader institutional direction that ATLAS training and ML support could connect to. |<\/p>\n<p>| FML school | training program | Mentioned by Daniel as a useful hybrid model with both open and ATLAS-specific components. |<\/p>\n<p>| Chatlists | tool/project | Used as an example of a semi-official shared effort that attracted contributors because it had a concrete day-to-day purpose. |<\/p>\n<p>| GitLab | development platform | Raised in discussion of whether AI agents should be allowed to operate there. |<\/p>\n<p>| RAG database | technical approach | Mentioned as part of ATLAS-specific LLM interaction and knowledge tooling. |<\/p>\n<p>| MCPs | technical tooling | Raised in the context of implementing orchestrated agent workflows. |<\/p>\n<p>| GN3 pub note | publication | Referenced as a related publication whose timing affected another ML pub note discussion. |<\/p>\n<p>| NSBI paper | paper | Referenced as an example of an ML-related soft publication with an unclear route through ATLAS structures. |<\/p>\n<p>| CMS ML group structure | organizational model | Discussed as a comparison point, including subgroups for knowledge, production, and innovation. |<\/p>\n<h2>Talk Highlights<\/h2>\n<h3>Robert Les<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Reported broad support for publishing more ML-focused ATLAS papers.<\/p>\n<\/li>\n<li>\n<p>Argued that ATLAS publication speed and venue choices are misaligned with ML career expectations and visibility.<\/p>\n<\/li>\n<li>\n<p>Described ambiguity over what counts as ATLAS ML work versus physics or performance work.<\/p>\n<\/li>\n<li>\n<p>Explained that ML pub notes have been faster but face policy and political obstacles, including arXiv limitations and overlap with other groups.<\/p>\n<\/li>\n<li>\n<p>Said ATLAS needs clearer guidance and publication strategy, especially if the ML forum becomes a working group.<\/p>\n<\/li>\n<li>\n<p>Mentioned potential follow-up work such as a transfer learning result for NeurIPS.<\/p>\n<\/li>\n<li>\n<p>Highlighted concern that ATLAS may be underrepresented in HEP/ML job spaces.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Whether pub notes could be put on arXiv.<\/p>\n<\/li>\n<li>\n<p>How to define what is ML work versus physics/performance work.<\/p>\n<\/li>\n<li>\n<p>How a future ML group should be structured and where its boundaries should lie.<\/p>\n<\/li>\n<\/ul>\n<h3>Verena Ingrid Martinez Outschoorn<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supported creating a clear publication path for ML papers.<\/p>\n<\/li>\n<li>\n<p>Shared experience of confusion around the process for simulation-based inference work and soft publication.<\/p>\n<\/li>\n<li>\n<p>Emphasized that publication expectations in data science PhD programs are often incompatible with current ATLAS output rates.<\/p>\n<\/li>\n<li>\n<p>Suggested ATLAS tutorials could help establish good ML practices and common tooling.<\/p>\n<\/li>\n<li>\n<p>Asked for more specificity on possible ML group organization.<\/p>\n<\/li>\n<li>\n<p>Raised upgrade and detector concerns, especially around dependencies, integration, and support for new systems.<\/p>\n<\/li>\n<li>\n<p>Argued for a centralized way to address some agentic workflow and operations issues.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>What exactly would a strengthened ML group look like organizationally?<\/p>\n<\/li>\n<li>\n<p>How should ATLAS support detector and operations use cases for ML?<\/p>\n<\/li>\n<li>\n<p>Should there be a centralized structure or task force for agentic workflows and related policies?<\/p>\n<\/li>\n<\/ul>\n<h3>Michael Kagan<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Strongly suggested the group will likely recommend a machine learning group.<\/p>\n<\/li>\n<li>\n<p>Argued that sister papers to analysis papers are likely the easiest publication case.<\/p>\n<\/li>\n<li>\n<p>Pushed back on framing all publication blockers as politics, citing concerns about self-scooping and respecting overlapping work.<\/p>\n<\/li>\n<li>\n<p>Warned against aiming for high ML paper volume at the expense of quality or ATLAS's mission.<\/p>\n<\/li>\n<li>\n<p>Questioned whether ATLAS should be expected to train AI researchers for external industry roles.<\/p>\n<\/li>\n<li>\n<p>Explored possible ML group roles in hosting papers, building shared tools, organizing tutorials, and handling cross-cutting model R&amp;D.<\/p>\n<\/li>\n<li>\n<p>Discussed whether agentic frameworks belong in an ML group or elsewhere.<\/p>\n<\/li>\n<li>\n<p>Committed to synthesizing the input into a proposal.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Do we actually have evidence about ATLAS people getting HEP/ML jobs versus CMS people?<\/p>\n<\/li>\n<li>\n<p>What can ATLAS reasonably do for ML training without overcommitting resources?<\/p>\n<\/li>\n<li>\n<p>How should model development responsibilities be delineated between an ML group and CP/physics groups?<\/p>\n<\/li>\n<li>\n<p>Where should agentic workflow development live organizationally?<\/p>\n<\/li>\n<\/ul>\n<h3>Daniel Murnane<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued that grants may be a particularly strong case for more methodological ML output because paper counts matter.<\/p>\n<\/li>\n<li>\n<p>Reported current ATLAS ML training is ad hoc, with a few lectures and workshop tutorials but no real onboarding.<\/p>\n<\/li>\n<li>\n<p>Suggested ML tutorials could be attached to existing events like Software Week.<\/p>\n<\/li>\n<li>\n<p>Supported a hybrid training model combining general open material with ATLAS-specific closed sessions.<\/p>\n<\/li>\n<li>\n<p>Described the central challenge of delineating what lives in an ML group versus CP groups as the 'million dollar question.'<\/p>\n<\/li>\n<li>\n<p>Emphasized that a real group needs concrete responsibilities and shared infrastructure to maintain, using SALT as an example.<\/p>\n<\/li>\n<li>\n<p>Argued that implementation expertise for LLM/agentic tooling should live somewhere concrete, likely in ML or software.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Would training belong in software induction or a broader ATLAS onboarding process?<\/p>\n<\/li>\n<li>\n<p>How should ATLAS argue for publishing methods before full physics exploitation?<\/p>\n<\/li>\n<li>\n<p>Where should the experts who implement Atlas-specific agent tooling live?<\/p>\n<\/li>\n<\/ul>\n<h3>James Catmore<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Noted that HEP is unusual in relying on thesis monographs rather than multiple authored papers, which limits individual visibility.<\/p>\n<\/li>\n<li>\n<p>Agreed that an ML group producing ML papers is the right direction, but cautioned that full review will not make papers faster.<\/p>\n<\/li>\n<li>\n<p>Linked the discussion to broader concerns about preparing students for diverse careers outside HEP.<\/p>\n<\/li>\n<li>\n<p>Suggested leveraging external training resources like the HSF training hub rather than building everything inside ATLAS.<\/p>\n<\/li>\n<li>\n<p>Supported connecting with the CERN AI strategy.<\/p>\n<\/li>\n<li>\n<p>Argued that some agent and LLM policy questions likely belong in software coordination, computing, or PubCom rather than an ML group.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>How should ATLAS help prepare students for a changing workplace when most will not remain in HEP?<\/p>\n<\/li>\n<li>\n<p>Should ATLAS rely more on shared community training infrastructure?<\/p>\n<\/li>\n<li>\n<p>Which organizational bodies should own AI agent policy questions?<\/p>\n<\/li>\n<\/ul>\n<h3>Bertrand Martin Dit Latour<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>Asked whether ATLAS currently has ML-specific training events comparable to software induction or onboarding.<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Do we have in Atlas training events in machine learning as we have for other things like Atlas software or induction days?<\/p>\n<\/li>\n<li>\n<p>Do the students learn this by going to dedicated schools or at their universities?<\/p>\n<\/li>\n<\/ul>\n<h3>Dan Guest<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Asked participants to share materials they covered.<\/p>\n<\/li>\n<li>\n<p>Suggested making better use of existing groups rather than automatically creating more groups.<\/p>\n<\/li>\n<li>\n<p>Asked how the discussion will actually be turned into something actionable.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>What about structuring not the machine learning group?<\/p>\n<\/li>\n<li>\n<p>What is the plan to actually turn this stuff into anything?<\/p>\n<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1697350", "type": "meeting", "title": "AI/ML Study Group - Eigth Meeting", "date": "2026-06-16", "important": true, "short_label": "Discussion Towards Recommendations Development, Reconstruction, Calibration, Analysis, Sustainable and Safe AI", "summary_md": "[Link To Indico](https://indico.cern.ch/event/1697350/)\n\n[Template for presentation](https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28) (note, copy before modifying!)", "minutes_md": "# Meeting Summary\n\nThe meeting focused on refining recommendations and slides for an ATLAS AI/ML discussion, with major emphasis on clarifying publication and open-data policy gaps, defining the role and structure of a future machine learning group, and addressing responsible and environmentally sustainable use of generative AI. Participants agreed current policies for releasing ML-ready datasets, pub notes, and related materials are unclear and burdensome, and that examples, motivations, and proposed review of policy gaps should be documented. They also discussed the need for dataset maintenance, FAIR-style guidance, and coordination with funded efforts such as Treasure/Genesis. On organization, the group debated how an AI/ML group should support infrastructure, incubation, and expertise without taking ownership away from physics and CP groups, stressing clear ownership boundaries, shared tooling, and horizontal integration across ATLAS. A substantial discussion also covered GenAI sustainability, collaboration culture, and review integrity, including the need for guidelines ensuring humans remain accountable for AI-generated code and text, while recognizing evolving software and computing guidance. The meeting ended with agreement to continue editing slides collaboratively and reconvene the next day at 2 PM, with additional input requested on publication and open-data slides.\n\n## Themes\n\n- Open data policy\n\n- Publication strategy\n\n- Dataset release process\n\n- Dataset maintenance\n\n- FAIR data guidelines\n\n- Machine learning group structure\n\n- Ownership and governance\n\n- Shared ML infrastructure\n\n- R&D incubation\n\n- Generative AI sustainability\n\n- Responsible AI use\n\n- Code review and merge request policy\n\n- Collaboration culture\n\n- Training and consultation\n\n## Action Items\n\n| Owner | Action | Quote |\n\n| --- | --- | --- |\n\n| Michael Kagan | Rob, Dan, and Caterina to add text to the publication slide about publication-policy gaps, open data, and dataset maintenance for later iteration. | Rob, Dan, Caterina, do you want to throw some text on that publication slide and then we iterate from there? We should also make sure to mention Andy's point about dataset maintenance. |\n\n| Daniel Murnane | The group to provide Pubcom with examples and clear pros and cons regarding archive posting and related publication-policy changes. | The ball is in our court to come back with examples and clear pros and cons. |\n\n| James Catmore | Software and Computing guidelines to be updated to reflect that humans should communicate with humans during merge request review, and feedback from this group is invited once uploaded. | We're going to update them a bit to reflect the point that we expect humans will communicate with humans during the merge request review and not leave people unsure whether they're talking to a fellow member or an LLM. |\n\n| Gordon T. Watts | Someone should draft one or two slides summarizing ideas around authorship-list reform or short-author-list questions so the group can discuss from a common baseline. | If we really want to do something like this, I suggest that we need somebody to take these ideas and write them down on a slide or two to get us all on the same page. |\n\n| Michael Kagan | Everyone to review the slides and add detailed comments, especially on contentious organizational and infrastructure questions. | I think everybody should really go and make detailed comments here or with me. |\n\n| Michael Kagan | People previously asked to add information, especially on publication and open-data slides, should add text before the next meeting. | Anybody wants to start, then another anyone who we asked to maybe add information to things like publication, open data slides, please go ahead and add text if you want. |\n\n| Michael Kagan | Reconvene the group the next day at 2 PM, with participants joining as schedules allow. | Why don't we try to start at two? |\n\n## External Resources\n\n| Resource | Type | Context |\n\n| --- | --- | --- |\n\n| Mattermost | communication tool | Used like chat during the meeting. |\n\n| Slides by Gordon and Michael | presentation | Working slides to be edited in real time to reflect the group's views. |\n\n| Environmental sustainability slides | presentation | Caterina's three scene-setting slides on the environmental sustainability of generative AI, plus bonus slides on contract/materials and known agents. |\n\n| GitLab Duo | coding assistance tool | Planned CERN rollout for GitLab users in a limited version, with expert version still unclear. |\n\n| GitHub Copilot Power User test bed | coding assistance program | EP has five licenses; ATLAS nominated Paul Gessinger-Bayford to test usefulness and report back. |\n\n| Paul Gessinger-Bayford | person/tester | Nominated by EP ATL to test GitHub Copilot Power User for a few weeks. |\n\n| CERN AI strategy | strategy document | Discussed as essentially summarizing Maurice's Washington talk. |\n\n| Washington Blueprint Workshop | workshop | Workshop on AI in the US organized by Peter Elmer. |\n\n| CERN data policy documents | policy documents | Referenced as unclear on where certain released datasets fall between policy levels. |\n\n| ATLAS Open Data Policy | policy document | Noted to require an associated paper, leaving some requested ML/open-data uses outside current scope. |\n\n| Pubcom | committee | Met with Rob and Daniel to discuss unclear publication policies and archive posting. |\n\n| arXiv | repository | Discussed as a place where more notes or proceedings might be posted. |\n\n| Treasure project | funded project | Referenced as a funded effort related to making data AI-ready. |\n\n| Genesis | funding/program context | Mentioned as related funding context for Treasure and policy gaps. |\n\n| TrackML dataset | dataset | Used as an example showing that public datasets require sustained maintenance, explanation, and readable supported code. |\n\n| Research Data Alliance | organization | Previously presented suggestions at an ML workshop on FAIR practices for data and models. |\n\n| FAIR guidelines | guideline framework | Discussed as useful principles for data, software, and ML, though needing adaptation and resourcing. |\n\n| International Energy Agency | organization/data source | Cited for projection that data-center electricity consumption may double from 2024 to 2030. |\n\n| WFCG | collaboration/project context | Ongoing work referenced on environmental impact of compute. |\n\n| LHC paper on environmental impact of compute | paper | Referenced as an example of transparency on compute sustainability, spearheaded by Zach. |\n\n| Software and Computing guidelines | guidelines | Existing and evolving guidance on AI use in merge requests and code review. |\n\n| SALT | software/framework | Cited as an example of software that originated in flavor tagging and may need broader support if adopted across groups. |\n\n| ONNX Runtime | software/runtime | Mentioned as an example of inference code that could benefit from centralized maintenance. |\n\n| Statistics forum | organizational model | Referenced as a possible analogy for expert support and open technical discussion. |\n\n| SBI paper | paper example | Used as an example of a physics result paired with a machine-learning methods paper. |\n\n| UKIF | forum/body | Suggested as a possible venue above ATLAS for coordinated input with CMS on FAIR and publication-related questions. |\n\n| ACFA recommendation | recommendation | Referenced as already commissioned and relevant to broader FAIR/publication discussions. |\n\n| ECFA/SERC council mandate | mandate | Mentioned as part of the wider policy landscape above ATLAS. |\n\n| CG white paper on infrastructure | white paper | Referenced as discussing integration of FAIR compliance into publication criteria and incentives. |\n\n| PNN workshop | workshop | Used as an example of cross-group ML discussions lacking a clear home for follow-up. |\n\n## Talk Highlights\n\n### Michael Kagan\n\nSalient points:\n\n- Proposed agenda: sustainability discussion, then posted text, then slide editing.\n\n- Emphasized real-time collaborative editing so slides reflect the group's views.\n\n- Summarized need to identify publication-policy gaps and likely recommend review rather than fully specify fixes.\n\n- Raised uncertainty about whether this group should make concrete recommendations or delegate unresolved issues to a future ML group.\n\n- Pushed repeatedly for concrete recommendations on structure, infrastructure, and publication rather than deferring everything.\n\n- Facilitated scheduling of follow-up meetings and requested comments/additions to slides.\n\nQuestions:\n\n- Do we have the time and the resources to do this?\n\n- Are we comfortable not completely answering that part of our mandate?\n\n- What structure helps facilitate that work?\n\n- What is the role of a machine learning group in it?\n\n### Caterina Doglioni\n\nSalient points:\n\n- Introduced environmental sustainability slides to establish shared understanding.\n\n- Argued that AI-ready open data requires curation and person power, not just data release.\n\n- Connected policy work to funded efforts such as Treasure/Genesis.\n\n- Advocated considering FAIR guidance, but warned against creating burdensome hoops without a dedicated task force.\n\n- Presented a nuanced overview of large-scale GenAI environmental impacts: electricity, water, minerals, e-waste, local justice, and Jevons paradox.\n\n- Recommended transparency, responsible-use guidelines, and a task force or forum to develop sustainability guidance.\n\n- Emphasized collaboration culture, review burden, and human accountability when using AI.\n\nQuestions:\n\n- What kind of action do we want to take?\n\n- Maybe one proposal could be that we think about what it means and what is useful and feasible for us?\n\n### Dan Guest\n\nSalient points:\n\n- Argued ATLAS lacks a clear policy for releasing ML-ready datasets.\n\n- Proposed documenting current problems and considering a release process comparable to pub notes rather than requiring executive-board escalation.\n\n- Highlighted examples where unclear policy caused unnecessary hoops such as STA requirements.\n\n- Supported standards and possibly certification for dataset release, while noting some existing releases already align closely with FAIR principles.\n\n- Warned that ownership boundaries must be very clear to avoid friction like in CMS.\n\n- Described flavor-tagging success as requiring substantial policy, pipeline, infrastructure, and deployment investment.\n\nQuestions:\n\n- I was wondering if we should have a policy on the same level as writing a pub note?\n\n### Andreas Salzburger\n\nSalient points:\n\n- Reported ongoing coding-assistance developments at CERN: GitLab Duo rollout and GitHub Copilot Power User testing.\n\n- Warned from TrackML experience that public datasets require ongoing interaction, maintenance, infrastructure, and supported code.\n\n- Argued for policy addressing exploitation of Atlas CI and review processes by LLM-heavy workflows.\n\n- Stressed that ML support should be horizontally embedded across ATLAS groups and tied to operational realities.\n\n- Warned against ML-heavy groups overriding CP groups or creating disconnects between papers and deployable experiment outcomes.\n\n- Highlighted the need to balance academic training and awareness of industry standards.\n\nQuestions:\n\n- How could a machine learning group support that work?\n\n### Gordon T. Watts\n\nSalient points:\n\n- Supported documenting why current publication policy creates ML-specific problems while being cautious about prescribing solutions too strongly.\n\n- Reminded the group that the upcoming talk must leave room for constructive discussion and cannot be too long.\n\n- Supported encouraging ATLAS-authored ML papers on internal data as long as they serve physics and are rigorous.\n\n- Suggested difficult authorship questions may need framing slides before broader discussion.\n\n- Helped close the meeting and urged asynchronous slide comments.\n\nQuestions:\n\n- So this is not just a talk, right?\n\n### Daniel Murnane\n\nSalient points:\n\n- Reported Pubcom itself was unclear on current policy foundations and interested in examples and tradeoffs.\n\n- Suggested open-data/publication strategy is ML-adjacent but likely requires serious follow-up by a future ML group or task force.\n\n- Observed that methodological ML publications may be a plausible area to raise authorship reform questions without requiring immediate answers.\n\n- Suggested cutting-edge R&D may arise in CP/physics groups, while an ML group could act as an incubation or scaling layer.\n\nQuestions:\n\n- Should a future ML group put some serious work into this problem?\n\n### Jason Oliver\n\nSalient points:\n\n- Supported archive posting of pub notes and suggested turning some into papers.\n\n- Argued FAIR-style ideas should begin as guidelines rather than hard requirements.\n\n- Raised concerns about vendor lock-in and maintainability if capabilities become dependent on LLMs.\n\n- Suggested merge-request signatures or explicit accountability practices could be considered.\n\n- Warned that scaling up low-discipline software practices through LLMs could be dangerous.\n\nQuestions:\n\n- Is there a signature as you do the merge request?\n\n### James Catmore\n\nSalient points:\n\n- Said new S&C guidelines were being prepared in response to AI-mediated merge-request interactions.\n\n- Invited feedback from the group once guidelines are uploaded.\n\n- Noted economic limits such as token costs may partially constrain overuse of agents.\n\n- Argued ATLAS should remain conservative because it spends public money and makes high-stakes scientific claims.\n\n- Updated the group that guidelines were posted to chat and would be amended to require clear human-to-human communication in review.\n\nQuestions:\n\n- Will some of these issues about overuse of agents be partly solved by token limits?\n\n### Sarah Louise Williams\n\nSalient points:\n\n- Urged recommendations to be actionable, self-sustaining, and robust to broader community opinions.\n\n- Suggested the report should indicate where responsibility should lie and where broader consultation is needed.\n\n- Recommended presenting specific suggestions as flexible structures that future groups can refine.\n\n### Robert Les\n\nSalient points:\n\n- Argued at minimum the strategy and workflow for open data decisions should be made transparent.\n\n- Noted the executive board, not the ML forum or CP groups, currently decides what is open data.\n\n- Observed that existing ATLAS hierarchy and cross-talk may reduce some concerns about overlap if an ML group is created.\n\n### Joaquin Hoya\n\nSalient points:\n\n- Supported human accountability for reviewed code.\n\n- Observed industry trends toward trusting coding agents heavily and asked the group to consider why.\n\n- Described the PNN workshop as revealing a lack of clear guidance and venue for follow-up across groups.\n\n- Argued for a place in ATLAS where people can discuss ML questions, guidance, and cross-community issues.\n\nQuestions:\n\n- Have you thought about this?\n\n- Should we put it in the CMBF part of the HMBS group? Should we go to the machine learning forum?\n\n### Verena Ingrid Martinez Outschoorn\n\nSalient points:\n\n- Suggested some R&D efforts might eventually mature into operational responsibilities or formal subgroups.\n\n- Encouraged making room in the proposed structure for projects to transition from experimentation to maintained operations.", "participants": [], "tags": [], "documents": [{"label": "Comments on last week", "url": "https://mattermost.web.cern.ch/atlassoftware/pl/fq4e9ye61irx9e954k74dd8y8e", "talk_title": "Discussion Towards Recommendations Development", "speaker_names": []}, {"label": "Foundation Model roundtable minutes", "url": "https://indico.cern.ch/event/1680385/attachments/3290480/5885587/ATLAS_Foundation_Model_Meeting_Minutes_2026-06-04.md", "talk_title": "Reconstruction, Calibration, Analysis", "speaker_names": []}, {"label": "Some slides about environmental impact of GenAI.pdf", "url": "https://indico.cern.ch/event/1697350/contributions/7137656/attachments/3295528/5893682/Some%20slides%20about%20environmental%20impact%20of%20GenAI.pdf", "talk_title": "Sustainable and Safe AI", "speaker_names": []}, {"label": "Some slides about environmental impact of GenAI", "url": "https://docs.google.com/presentation/d/1XFdysLdRXIUpLhhpeptuK-Ba8-R7ugYIVnyeeaTj3EY/edit?usp=sharing", "talk_title": "Sustainable and Safe AI", "speaker_names": []}, {"label": "2026-06-16 - Meeting.cleaned.md", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898910/2026-06-16%20-%20Meeting.cleaned.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-16 - Meeting.focus-areas.md", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898911/2026-06-16%20-%20Meeting.focus-areas.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-16 - Meeting.summary.md", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898912/2026-06-16%20-%20Meeting.summary.md", "talk_title": null, "speaker_names": []}, {"label": "GMT20260616-133417_Recording_2190x1320.mp4", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898826/GMT20260616-133417_Recording_2190x1320.mp4", "talk_title": null, "speaker_names": []}, {"label": "GMT20260616-133417_Recording.cc.vtt", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898827/GMT20260616-133417_Recording.cc.vtt", "talk_title": null, "speaker_names": []}, {"label": "Michael&#39;s final slides (draft)", "url": "https://docs.google.com/presentation/d/1w2juA9Yn_tfF23U6g2dqqwuzENAm5_02F63_hAdsSDg/edit?slide=id.p1#slide=id.p1", "talk_title": null, "speaker_names": []}, {"label": "transcript.txt", "url": "https://indico.cern.ch/event/1697350/attachments/3297365/5898828/transcript.txt", "talk_title": null, "speaker_names": []}], "contributions": [{"title": "ECSB Thoughts", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Discussion Towards Recommendations Development", "speaker_names": [], "documents": [{"label": "Comments on last week", "url": "https://indico.cern.ch/event/1697350/contributions/7137666/attachments/3291925/5886422/go", "talk_title": "Discussion Towards Recommendations Development", "speaker_names": []}], "minutes_md": null, "minutes_html": ""}, {"title": "CERN AI Strategy News", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Event Generation and Simulation", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Reconstruction, Calibration, Analysis", "speaker_names": [], "documents": [{"label": "Foundation Model roundtable minutes", "url": "https://indico.cern.ch/event/1697350/contributions/7137663/attachments/3297001/5896697/go", "talk_title": "Reconstruction, Calibration, Analysis", "speaker_names": []}], "minutes_md": null, "minutes_html": ""}, {"title": "Trigger and Real-Time Systems", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Data Quality Monitoring and Validation", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Operations and Detector Control", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Computing Operations", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Training and Community Building", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "The Larger Community and Open Data", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Sustainable and Safe AI", "speaker_names": [], "documents": [{"label": "Some slides about environmental impact of GenAI.pdf", "url": "https://indico.cern.ch/event/1697350/contributions/7137656/attachments/3295528/5893682/Some%20slides%20about%20environmental%20impact%20of%20GenAI.pdf", "talk_title": "Sustainable and Safe AI", "speaker_names": []}, {"label": "Some slides about environmental impact of GenAI", "url": "https://indico.cern.ch/event/1697350/contributions/7137656/attachments/3295528/5893681/go", "talk_title": "Sustainable and Safe AI", "speaker_names": []}], "minutes_md": null, "minutes_html": ""}, {"title": "Cross-Cutting Concerns", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}], "source_name": "AI/ML study group", "source_color": "#dee5f5", "summary_html": "<p><a href=\"https://indico.cern.ch/event/1697350/\" target=\"_blank\" rel=\"noopener noreferrer\">Link To Indico<\/a><\/p>\n<p><a href=\"https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28\" target=\"_blank\" rel=\"noopener noreferrer\">Template for presentation<\/a> (note, copy before modifying!)<\/p>\n", "minutes_html": "<h1>Meeting Summary<\/h1>\n<p>The meeting focused on refining recommendations and slides for an ATLAS AI/ML discussion, with major emphasis on clarifying publication and open-data policy gaps, defining the role and structure of a future machine learning group, and addressing responsible and environmentally sustainable use of generative AI. Participants agreed current policies for releasing ML-ready datasets, pub notes, and related materials are unclear and burdensome, and that examples, motivations, and proposed review of policy gaps should be documented. They also discussed the need for dataset maintenance, FAIR-style guidance, and coordination with funded efforts such as Treasure/Genesis. On organization, the group debated how an AI/ML group should support infrastructure, incubation, and expertise without taking ownership away from physics and CP groups, stressing clear ownership boundaries, shared tooling, and horizontal integration across ATLAS. A substantial discussion also covered GenAI sustainability, collaboration culture, and review integrity, including the need for guidelines ensuring humans remain accountable for AI-generated code and text, while recognizing evolving software and computing guidance. The meeting ended with agreement to continue editing slides collaboratively and reconvene the next day at 2 PM, with additional input requested on publication and open-data slides.<\/p>\n<h2>Themes<\/h2>\n<ul>\n<li>\n<p>Open data policy<\/p>\n<\/li>\n<li>\n<p>Publication strategy<\/p>\n<\/li>\n<li>\n<p>Dataset release process<\/p>\n<\/li>\n<li>\n<p>Dataset maintenance<\/p>\n<\/li>\n<li>\n<p>FAIR data guidelines<\/p>\n<\/li>\n<li>\n<p>Machine learning group structure<\/p>\n<\/li>\n<li>\n<p>Ownership and governance<\/p>\n<\/li>\n<li>\n<p>Shared ML infrastructure<\/p>\n<\/li>\n<li>\n<p>R&amp;D incubation<\/p>\n<\/li>\n<li>\n<p>Generative AI sustainability<\/p>\n<\/li>\n<li>\n<p>Responsible AI use<\/p>\n<\/li>\n<li>\n<p>Code review and merge request policy<\/p>\n<\/li>\n<li>\n<p>Collaboration culture<\/p>\n<\/li>\n<li>\n<p>Training and consultation<\/p>\n<\/li>\n<\/ul>\n<h2>Action Items<\/h2>\n<p>| Owner | Action | Quote |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| Michael Kagan | Rob, Dan, and Caterina to add text to the publication slide about publication-policy gaps, open data, and dataset maintenance for later iteration. | Rob, Dan, Caterina, do you want to throw some text on that publication slide and then we iterate from there? We should also make sure to mention Andy's point about dataset maintenance. |<\/p>\n<p>| Daniel Murnane | The group to provide Pubcom with examples and clear pros and cons regarding archive posting and related publication-policy changes. | The ball is in our court to come back with examples and clear pros and cons. |<\/p>\n<p>| James Catmore | Software and Computing guidelines to be updated to reflect that humans should communicate with humans during merge request review, and feedback from this group is invited once uploaded. | We're going to update them a bit to reflect the point that we expect humans will communicate with humans during the merge request review and not leave people unsure whether they're talking to a fellow member or an LLM. |<\/p>\n<p>| Gordon T. Watts | Someone should draft one or two slides summarizing ideas around authorship-list reform or short-author-list questions so the group can discuss from a common baseline. | If we really want to do something like this, I suggest that we need somebody to take these ideas and write them down on a slide or two to get us all on the same page. |<\/p>\n<p>| Michael Kagan | Everyone to review the slides and add detailed comments, especially on contentious organizational and infrastructure questions. | I think everybody should really go and make detailed comments here or with me. |<\/p>\n<p>| Michael Kagan | People previously asked to add information, especially on publication and open-data slides, should add text before the next meeting. | Anybody wants to start, then another anyone who we asked to maybe add information to things like publication, open data slides, please go ahead and add text if you want. |<\/p>\n<p>| Michael Kagan | Reconvene the group the next day at 2 PM, with participants joining as schedules allow. | Why don't we try to start at two? |<\/p>\n<h2>External Resources<\/h2>\n<p>| Resource | Type | Context |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| Mattermost | communication tool | Used like chat during the meeting. |<\/p>\n<p>| Slides by Gordon and Michael | presentation | Working slides to be edited in real time to reflect the group's views. |<\/p>\n<p>| Environmental sustainability slides | presentation | Caterina's three scene-setting slides on the environmental sustainability of generative AI, plus bonus slides on contract/materials and known agents. |<\/p>\n<p>| GitLab Duo | coding assistance tool | Planned CERN rollout for GitLab users in a limited version, with expert version still unclear. |<\/p>\n<p>| GitHub Copilot Power User test bed | coding assistance program | EP has five licenses; ATLAS nominated Paul Gessinger-Bayford to test usefulness and report back. |<\/p>\n<p>| Paul Gessinger-Bayford | person/tester | Nominated by EP ATL to test GitHub Copilot Power User for a few weeks. |<\/p>\n<p>| CERN AI strategy | strategy document | Discussed as essentially summarizing Maurice's Washington talk. |<\/p>\n<p>| Washington Blueprint Workshop | workshop | Workshop on AI in the US organized by Peter Elmer. |<\/p>\n<p>| CERN data policy documents | policy documents | Referenced as unclear on where certain released datasets fall between policy levels. |<\/p>\n<p>| ATLAS Open Data Policy | policy document | Noted to require an associated paper, leaving some requested ML/open-data uses outside current scope. |<\/p>\n<p>| Pubcom | committee | Met with Rob and Daniel to discuss unclear publication policies and archive posting. |<\/p>\n<p>| arXiv | repository | Discussed as a place where more notes or proceedings might be posted. |<\/p>\n<p>| Treasure project | funded project | Referenced as a funded effort related to making data AI-ready. |<\/p>\n<p>| Genesis | funding/program context | Mentioned as related funding context for Treasure and policy gaps. |<\/p>\n<p>| TrackML dataset | dataset | Used as an example showing that public datasets require sustained maintenance, explanation, and readable supported code. |<\/p>\n<p>| Research Data Alliance | organization | Previously presented suggestions at an ML workshop on FAIR practices for data and models. |<\/p>\n<p>| FAIR guidelines | guideline framework | Discussed as useful principles for data, software, and ML, though needing adaptation and resourcing. |<\/p>\n<p>| International Energy Agency | organization/data source | Cited for projection that data-center electricity consumption may double from 2024 to 2030. |<\/p>\n<p>| WFCG | collaboration/project context | Ongoing work referenced on environmental impact of compute. |<\/p>\n<p>| LHC paper on environmental impact of compute | paper | Referenced as an example of transparency on compute sustainability, spearheaded by Zach. |<\/p>\n<p>| Software and Computing guidelines | guidelines | Existing and evolving guidance on AI use in merge requests and code review. |<\/p>\n<p>| SALT | software/framework | Cited as an example of software that originated in flavor tagging and may need broader support if adopted across groups. |<\/p>\n<p>| ONNX Runtime | software/runtime | Mentioned as an example of inference code that could benefit from centralized maintenance. |<\/p>\n<p>| Statistics forum | organizational model | Referenced as a possible analogy for expert support and open technical discussion. |<\/p>\n<p>| SBI paper | paper example | Used as an example of a physics result paired with a machine-learning methods paper. |<\/p>\n<p>| UKIF | forum/body | Suggested as a possible venue above ATLAS for coordinated input with CMS on FAIR and publication-related questions. |<\/p>\n<p>| ACFA recommendation | recommendation | Referenced as already commissioned and relevant to broader FAIR/publication discussions. |<\/p>\n<p>| ECFA/SERC council mandate | mandate | Mentioned as part of the wider policy landscape above ATLAS. |<\/p>\n<p>| CG white paper on infrastructure | white paper | Referenced as discussing integration of FAIR compliance into publication criteria and incentives. |<\/p>\n<p>| PNN workshop | workshop | Used as an example of cross-group ML discussions lacking a clear home for follow-up. |<\/p>\n<h2>Talk Highlights<\/h2>\n<h3>Michael Kagan<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Proposed agenda: sustainability discussion, then posted text, then slide editing.<\/p>\n<\/li>\n<li>\n<p>Emphasized real-time collaborative editing so slides reflect the group's views.<\/p>\n<\/li>\n<li>\n<p>Summarized need to identify publication-policy gaps and likely recommend review rather than fully specify fixes.<\/p>\n<\/li>\n<li>\n<p>Raised uncertainty about whether this group should make concrete recommendations or delegate unresolved issues to a future ML group.<\/p>\n<\/li>\n<li>\n<p>Pushed repeatedly for concrete recommendations on structure, infrastructure, and publication rather than deferring everything.<\/p>\n<\/li>\n<li>\n<p>Facilitated scheduling of follow-up meetings and requested comments/additions to slides.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Do we have the time and the resources to do this?<\/p>\n<\/li>\n<li>\n<p>Are we comfortable not completely answering that part of our mandate?<\/p>\n<\/li>\n<li>\n<p>What structure helps facilitate that work?<\/p>\n<\/li>\n<li>\n<p>What is the role of a machine learning group in it?<\/p>\n<\/li>\n<\/ul>\n<h3>Caterina Doglioni<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Introduced environmental sustainability slides to establish shared understanding.<\/p>\n<\/li>\n<li>\n<p>Argued that AI-ready open data requires curation and person power, not just data release.<\/p>\n<\/li>\n<li>\n<p>Connected policy work to funded efforts such as Treasure/Genesis.<\/p>\n<\/li>\n<li>\n<p>Advocated considering FAIR guidance, but warned against creating burdensome hoops without a dedicated task force.<\/p>\n<\/li>\n<li>\n<p>Presented a nuanced overview of large-scale GenAI environmental impacts: electricity, water, minerals, e-waste, local justice, and Jevons paradox.<\/p>\n<\/li>\n<li>\n<p>Recommended transparency, responsible-use guidelines, and a task force or forum to develop sustainability guidance.<\/p>\n<\/li>\n<li>\n<p>Emphasized collaboration culture, review burden, and human accountability when using AI.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>What kind of action do we want to take?<\/p>\n<\/li>\n<li>\n<p>Maybe one proposal could be that we think about what it means and what is useful and feasible for us?<\/p>\n<\/li>\n<\/ul>\n<h3>Dan Guest<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued ATLAS lacks a clear policy for releasing ML-ready datasets.<\/p>\n<\/li>\n<li>\n<p>Proposed documenting current problems and considering a release process comparable to pub notes rather than requiring executive-board escalation.<\/p>\n<\/li>\n<li>\n<p>Highlighted examples where unclear policy caused unnecessary hoops such as STA requirements.<\/p>\n<\/li>\n<li>\n<p>Supported standards and possibly certification for dataset release, while noting some existing releases already align closely with FAIR principles.<\/p>\n<\/li>\n<li>\n<p>Warned that ownership boundaries must be very clear to avoid friction like in CMS.<\/p>\n<\/li>\n<li>\n<p>Described flavor-tagging success as requiring substantial policy, pipeline, infrastructure, and deployment investment.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>I was wondering if we should have a policy on the same level as writing a pub note?<\/li>\n<\/ul>\n<h3>Andreas Salzburger<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Reported ongoing coding-assistance developments at CERN: GitLab Duo rollout and GitHub Copilot Power User testing.<\/p>\n<\/li>\n<li>\n<p>Warned from TrackML experience that public datasets require ongoing interaction, maintenance, infrastructure, and supported code.<\/p>\n<\/li>\n<li>\n<p>Argued for policy addressing exploitation of Atlas CI and review processes by LLM-heavy workflows.<\/p>\n<\/li>\n<li>\n<p>Stressed that ML support should be horizontally embedded across ATLAS groups and tied to operational realities.<\/p>\n<\/li>\n<li>\n<p>Warned against ML-heavy groups overriding CP groups or creating disconnects between papers and deployable experiment outcomes.<\/p>\n<\/li>\n<li>\n<p>Highlighted the need to balance academic training and awareness of industry standards.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>How could a machine learning group support that work?<\/li>\n<\/ul>\n<h3>Gordon T. Watts<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supported documenting why current publication policy creates ML-specific problems while being cautious about prescribing solutions too strongly.<\/p>\n<\/li>\n<li>\n<p>Reminded the group that the upcoming talk must leave room for constructive discussion and cannot be too long.<\/p>\n<\/li>\n<li>\n<p>Supported encouraging ATLAS-authored ML papers on internal data as long as they serve physics and are rigorous.<\/p>\n<\/li>\n<li>\n<p>Suggested difficult authorship questions may need framing slides before broader discussion.<\/p>\n<\/li>\n<li>\n<p>Helped close the meeting and urged asynchronous slide comments.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>So this is not just a talk, right?<\/li>\n<\/ul>\n<h3>Daniel Murnane<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Reported Pubcom itself was unclear on current policy foundations and interested in examples and tradeoffs.<\/p>\n<\/li>\n<li>\n<p>Suggested open-data/publication strategy is ML-adjacent but likely requires serious follow-up by a future ML group or task force.<\/p>\n<\/li>\n<li>\n<p>Observed that methodological ML publications may be a plausible area to raise authorship reform questions without requiring immediate answers.<\/p>\n<\/li>\n<li>\n<p>Suggested cutting-edge R&amp;D may arise in CP/physics groups, while an ML group could act as an incubation or scaling layer.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>Should a future ML group put some serious work into this problem?<\/li>\n<\/ul>\n<h3>Jason Oliver<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supported archive posting of pub notes and suggested turning some into papers.<\/p>\n<\/li>\n<li>\n<p>Argued FAIR-style ideas should begin as guidelines rather than hard requirements.<\/p>\n<\/li>\n<li>\n<p>Raised concerns about vendor lock-in and maintainability if capabilities become dependent on LLMs.<\/p>\n<\/li>\n<li>\n<p>Suggested merge-request signatures or explicit accountability practices could be considered.<\/p>\n<\/li>\n<li>\n<p>Warned that scaling up low-discipline software practices through LLMs could be dangerous.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>Is there a signature as you do the merge request?<\/li>\n<\/ul>\n<h3>James Catmore<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Said new S&amp;C guidelines were being prepared in response to AI-mediated merge-request interactions.<\/p>\n<\/li>\n<li>\n<p>Invited feedback from the group once guidelines are uploaded.<\/p>\n<\/li>\n<li>\n<p>Noted economic limits such as token costs may partially constrain overuse of agents.<\/p>\n<\/li>\n<li>\n<p>Argued ATLAS should remain conservative because it spends public money and makes high-stakes scientific claims.<\/p>\n<\/li>\n<li>\n<p>Updated the group that guidelines were posted to chat and would be amended to require clear human-to-human communication in review.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>Will some of these issues about overuse of agents be partly solved by token limits?<\/li>\n<\/ul>\n<h3>Sarah Louise Williams<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Urged recommendations to be actionable, self-sustaining, and robust to broader community opinions.<\/p>\n<\/li>\n<li>\n<p>Suggested the report should indicate where responsibility should lie and where broader consultation is needed.<\/p>\n<\/li>\n<li>\n<p>Recommended presenting specific suggestions as flexible structures that future groups can refine.<\/p>\n<\/li>\n<\/ul>\n<h3>Robert Les<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued at minimum the strategy and workflow for open data decisions should be made transparent.<\/p>\n<\/li>\n<li>\n<p>Noted the executive board, not the ML forum or CP groups, currently decides what is open data.<\/p>\n<\/li>\n<li>\n<p>Observed that existing ATLAS hierarchy and cross-talk may reduce some concerns about overlap if an ML group is created.<\/p>\n<\/li>\n<\/ul>\n<h3>Joaquin Hoya<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supported human accountability for reviewed code.<\/p>\n<\/li>\n<li>\n<p>Observed industry trends toward trusting coding agents heavily and asked the group to consider why.<\/p>\n<\/li>\n<li>\n<p>Described the PNN workshop as revealing a lack of clear guidance and venue for follow-up across groups.<\/p>\n<\/li>\n<li>\n<p>Argued for a place in ATLAS where people can discuss ML questions, guidance, and cross-community issues.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Have you thought about this?<\/p>\n<\/li>\n<li>\n<p>Should we put it in the CMBF part of the HMBS group? Should we go to the machine learning forum?<\/p>\n<\/li>\n<\/ul>\n<h3>Verena Ingrid Martinez Outschoorn<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Suggested some R&amp;D efforts might eventually mature into operational responsibilities or formal subgroups.<\/p>\n<\/li>\n<li>\n<p>Encouraged making room in the proposed structure for projects to transition from experimentation to maintained operations.<\/p>\n<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1700148", "type": "meeting", "title": "AI/ML Study Group - Ninth Meeting", "date": "2026-06-17", "important": true, "short_label": null, "summary_md": "[Link To Indico](https://indico.cern.ch/event/1700148/)\n\n[Template for presentation](https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28) (note, copy before modifying!)", "minutes_md": "# Meeting Summary\n\nThe discussion focused on reshaping the ATLAS AI/ML effort into a transversal support structure that strengthens, rather than replaces, existing CP and physics groups by providing common infrastructure, tooling, training, communication channels, and possibly a centralized ML repository or coherent software layer. Participants repeatedly emphasized avoiding ownership conflicts or siphoning people out of CP groups while improving standardization, model deployment, data access, scaling support, and cross-group knowledge transfer through liaisons, hackathons, concrete tasks, and common methods. The group also debated mandate and accountability, with some advocating a stronger ownership role for the ML group over infrastructure and best-practice recommendations, while others stressed coordination with software and computing structures already responsible for coherent production environments. Additional themes included operations-specific ML needs, methods papers and publication pathways, training and safety guidance for coding agents and agentic workflows, hardware and GPU planning under uncertainty, access to shared compute resources, and whether ATLAS should articulate short AI funding priorities or a white paper to support collaborators and inform future funding discussions.\n\n## Themes\n\n- ML group mandate\n\n- CP group support\n\n- Common infrastructure\n\n- Standardization\n\n- Cross-group communication\n\n- Liaisons\n\n- Training\n\n- Hackathons\n\n- Central ML repository\n\n- Software stack choices\n\n- Operations ML\n\n- Compute scaling\n\n- GPU planning\n\n- Shared compute access\n\n- Funding priorities\n\n- Publication strategy\n\n- Methods papers\n\n- Open data policy\n\n- Coding agents\n\n- Safety guidelines\n\n## Action Items\n\n| Owner | Action | Quote |\n\n| --- | --- | --- |\n\n| Gordon T. Watts | Reformulate the slides using concrete examples to strengthen the case for changing how the ML group works. | These concrete examples have given both Michael and I a lot of really good grist to try and reformulate these slides a little bit to make the point stronger. |\n\n| Michael Kagan | Add a bullet about hackathons as a concrete mechanism for knowledge exchange and synchronization across groups. | We should add a bullet about hackathons. |\n\n| Michael Kagan | Clarify in the document that more training is needed for ML, coding agents, and agentic workflows, and point people to ATLAS-specific and external opportunities. | We can try to be a lot more clear about when there are opportunities for people to engage, because there are also summer and winter schools on machine learning and machine learning for physics. |\n\n| Michael Kagan | Set up task forces to study agentic workflows and related issues on both the data analysis and operations sides. | We should set up task forces to work on this, both on the data analysis side and on the operations side. |\n\n| Michael Kagan | Task Dan, James, and Katarina with producing the sustainability, equity, and safety slide by the next day. | I am going to task, by tomorrow, Dan, James, and Katarina to produce this slide. |\n\n| James Richard Catmore | Write material for the sustainability, equity, and safety slide, potentially in the form of questions for the collaboration. | I can write some. |\n\n| Gordon T. Watts | Discuss slide bullet points asynchronously on Mattermost and include Katerina and Sarah Williams in the discussion. | If you could, and then discussing them on Mattermost, that would be great. Make sure Katerina is part of that, and Sarah Williams, who's also been thinking about this. |\n\n| Michael Kagan | Gordon and Michael should produce the revised slides. | So you and I should produce slides by Sunish. |\n\n| Gordon T. Watts | Prepare a fresh version of the talk starting from scratch while keeping the current deck as documentation/reference. | Personally, I'm going to start from scratch, but use this as a reference. |\n\n| Dan Guest | Condense the slide text substantially. | In general, the text needs to be condensed down to a lot less points. It is way too much text. |\n\n| Dan Guest | Ensure the introduction states that a more detailed document is being developed to add concrete substance beyond the slides. | In the intro, we need to point out that we're working on a document to actually put some teeth on this stuff. |\n\n| Michael Kagan | Leave limited authorship out of the current recommendations and defer further discussion until after ATLAS week. | We will not say anything about limited authorship for now. |\n\n| Dan Guest | Encourage inclusion of training on repository permissions, safe development practices, and sandboxing when using agents in software onboarding. | Somewhere in the software introduction that we have, like the standard induction day stuff, we should be encouraging people to understand read and write permissions... If we are going to be telling people to use agents and such, it's worth considering explaining various ways of sandboxing them. |\n\n| Daniel Thomas Murnane | Consider a concrete recommendation for ATLAS to apply for a large EuroHPC GPU allocation managed by the ML group. | Atlas should apply for about 10 million GPU hours on EuroHPC as Atlas. The ML group is in charge of that allocation and gives it out. |\n\n| Lukas Alexander Heinrich | Consider a scaling task force to study where large-scale ML training and scaling could be impactful. | Maybe in terms of recommendation, there should be a task for a scaling task force. |\n\n## External Resources\n\n| Resource | Type | Context |\n\n| --- | --- | --- |\n\n| ML forum | forum | Current ATLAS machine learning discussion venue; described as not working well enough in its present form. |\n\n| CP group liaisons | coordination structure | Existing overlap mechanism between ML efforts and CP groups. |\n\n| Common Methods Background Forum | forum/model | HMBS structure cited by Jason Oliver as a model for factorizing common work. |\n\n| Athena | software repository/framework | Used as the analogy for a centralized production-level software home that ML currently lacks. |\n\n| ATLAS ML repo | proposed repository | Suggested centralized repository for production-level ML development across CP groups. |\n\n| Salt | ML tool/framework | Referenced as infrastructure in flavor tagging and in discussion of responsibility for efficient multi-GPU training and onboarding. |\n\n| Perlmutter | HPC system | Referenced as a system users should be able to run on efficiently. |\n\n| Base One | tool/system | Operations example where separate groups faced the same issues without communicating. |\n\n| Felix | tool/system | Operations example paired with Base One to illustrate duplicated effort. |\n\n| eLogs | data source | Example source operations might analyze with LLMs. |\n\n| tier 0 histograms | data source | Example data source for anomaly detection in operations. |\n\n| ONNX | software format/tool | Highlighted by James as important for inference and coherent ATLAS software integration. |\n\n| CERN SFT LCG software platforms | software platform | External releases that constrain ATLAS versions of Python, CUDA, and PyTorch. |\n\n| PyTorch | ML framework | Discussed as a likely common choice for parts of the ML stack. |\n\n| Jax | ML framework | Mentioned in discussion of avoiding too many production frameworks. |\n\n| Keras | ML framework | Mentioned in discussion of avoiding too many production frameworks. |\n\n| TensorFlow | ML framework | Mentioned in discussion of avoiding too many production frameworks. |\n\n| Mattermost | communication tool | Proposed for follow-up discussion on bullet points and revisions. |\n\n| EuroHPC | compute resource program | Suggested as a source of GPU hours for ATLAS-managed ML work. |\n\n| ICB | board | International Computing Board of ATLAS; key body for long-term computing purchases and planning. |\n\n| CRSG | committee/group | Referenced in relation to accountability for computing resource use. |\n\n| LHCC | committee | Referenced both in review obligations and in recommendations to computing coordinators. |\n\n| OAB | board/group | Referenced as a venue where inference and grid/Tier-0 issues were emphasized. |\n\n| NGT | funding/program example | Used as an example of ATLAS support letters for proposal activity. |\n\n| Genesis | proposal/program | Referenced in discussion of support letters tied to NGT-related proposals. |\n\n| HSF white papers | community white papers | Examples of AI/software priority documents involving ATLAS people but without official ATLAS branding. |\n\n| IRIS-HEP | community initiative | Referenced via hub efforts and white-paper style coordination. |\n\n| Stanford Human Center for AI | institution/example | Cited as an example of regularly updated AI priorities. |\n\n| Olivia | leadership-class machine | Norwegian machine cited as an example of non-HEP infrastructure that ATLAS collaborators can apply to use. |\n\n| Summer and winter schools on ML and ML for physics | training programs | External opportunities that ATLAS could better connect people to. |\n\n| ATLAS tutorial group | training structure | Identified as having a role in ATLAS-specific training. |\n\n| Carlo Challenge | challenge/benchmark | Example where accessible data and comparisons helped produce useful models. |\n\n## Talk Highlights\n\n### Dan Guest\n\nSalient points:\n\n- Frame the proposal as supporting and organizing existing effort rather than correcting poor performance.\n\n- Scope should focus on centralized deployment infrastructure, saving protocols, inference tooling in Athena, and shared tooling.\n\n- Training within CP groups should remain in those groups.\n\n- More training is needed, including coding-agent safety, permissions, and sandboxing.\n\n- Transparency matters in funding-priority communication.\n\n- Slides are too text-heavy and should signal that a fuller document will follow.\n\nQuestions:\n\n- Do we want to encourage efforts to test what models and hardware we might need?\n\n- Does it make sense for ATLAS to produce a clearer public explanation of AI priorities?\n\n### Gordon T. Watts\n\nSalient points:\n\n- Supports a framing centered on providing infrastructure and broader sharing.\n\n- Wants high-level recommendations rather than deep technical prescriptions in the presentation.\n\n- Sees value in concrete examples to motivate structural changes.\n\n- Warns that cross-group liaison structures can fail without careful design.\n\n- Supports short straw recommendations and possibly a very short priorities white paper.\n\n- Advocates deferring limited authorship from current recommendations.\n\nQuestions:\n\n- How should the AI/ML cross-cutting group be staffed and interact with analyses?\n\n- Are concerns mainly about ownership transfer from CP groups into an ML group?\n\n### Lukas Heinrich\n\nSalient points:\n\n- Argued for a structure that channels ML effort across CP groups without siphoning away people.\n\n- Stressed that ML discussions should happen in ML-heavy venues while domain work remains in CP groups.\n\n- Proposed a centralized ML repository analogous to Athena and strategic choices on production frameworks.\n\n- Advocated a machine-learning layer similar to the software group that can make recommendations on formats, frameworks, and inference strategies.\n\n- Suggested hackathons and scaling task forces as concrete coordination mechanisms.\n\n- Raised interest in communicating AI priorities and timelines relevant to funding calls.\n\nQuestions:\n\n- What are we trying to achieve with the structure?\n\n- How do people in funding-priority discussions learn the ML group's collective priorities?\n\n- If ATLAS applies for large allocations, how will it use them effectively?\n\n### Daniel Murnane\n\nSalient points:\n\n- Said the current ML forum is not working and proposed an infrastructure-focused support group with liaisons and strike-team behavior.\n\n- Argued the ML group should incubate and scale projects once they hit technical barriers.\n\n- Pushed for a stronger ownership model around efficient training, tooling, onboarding, and benchmarking.\n\n- Suggested the ML group should compare architectures and baselines systematically.\n\n- Supported nimble task forces for emerging issues.\n\n- Proposed a concrete EuroHPC GPU-hours recommendation.\n\nQuestions:\n\n- Who has ownership over inefficient training, bad data loaders, poor onboarding, or underused methods-paper opportunities?\n\n### Jason Oliver\n\nSalient points:\n\n- Supported Daniel's proposal and presented an alternative organizational visualization emphasizing shared resources.\n\n- Suggested the Common Methods Background Forum as a structural model.\n\n- Saw infrastructure groups as vehicles for standardization and faster adoption.\n\n- Raised the need to measure computing use and workflow experience if the ML group issues recommendations.\n\n- Suggested documenting community feedback about publication barriers.\n\nQuestions:\n\n- How should the alternative visualization differ from the earlier slide in people's interpretation?\n\n- If recommendations are made, how can usage and outcomes be measured per group or workflow?\n\n### Andreas Salzburger\n\nSalient points:\n\n- Advocated R&D support, transversal infrastructure support, training, and concrete task-oriented coordination.\n\n- Emphasized no need to restructure CP topical work, but rather to provide support, guidance, and expertise.\n\n- Urged grounding the discussion in concrete examples and smaller deliverables.\n\n- Highlighted the distinction between hardware use cases and the danger of conflating GPU needs.\n\n- Supported better understanding of compute needs and costing as part of the ML group's mandate.\n\n- Raised questions about how ATLAS should connect to external AI structures and funding initiatives.\n\nQuestions:\n\n- How can concrete steps be defined rather than more meetings?\n\n- How should external structures and funding programs connect back into an ATLAS AI/ML structure?\n\n### Joaquin Hoya\n\nSalient points:\n\n- Spoke from the operations side about weak cross-group communication and duplicated development.\n\n- Wanted the new group to connect operations communities around common tools and infrastructure.\n\n- Stressed that common tools and clear contacts with groups would be valuable.\n\n- Noted that operations tooling constraints and release practices make technology choices especially critical.\n\nQuestions:\n\n- Can the new AI/ML group improve communication enough to stop groups from independently solving the same problems?\n\n### Michael Kagan\n\nSalient points:\n\n- Repeatedly stressed that physics/CP groups should continue training their own models.\n\n- Pushed back on solutions that amount to 'just another meeting' and wanted concrete common work that accelerates innovation transfer.\n\n- Favored adding hackathons and task forces, improving training and guidelines, and clarifying recommendations.\n\n- Raised questions about operations-specific acceleration and tooling differences.\n\n- Led discussion on publication strategy, methods papers, and deferring limited authorship.\n\n- Framed hardware planning as a warning and support issue rather than a concrete procurement recommendation.\n\nQuestions:\n\n- What can an ML group provide to operations if projects remain in their home groups?\n\n- Will operations need different tooling than CP groups?\n\n- Do we want to consider recommending an ATLAS AI priorities white paper?\n\n### James Richard Catmore\n\nSalient points:\n\n- Argued that much of the organizational issue is really about where topics are discussed and who attends which meetings.\n\n- Said CP groups should not be restructured and the ML group's role should be support, guidance, common training, and generic-topic discussion.\n\n- Clarified formal accountability for computing use lies with computing coordinators and existing structures.\n\n- Explained software-group responsibility for maintaining a coherent ATLAS software stack, including external constraints from CERN SFT.\n\n- Supported methods-oriented publication discussion and deferred ethical/safety slide drafting into question form.\n\nQuestions:\n\n- Is accountability really the main issue, or is the main issue making things work?\n\n- Should ethical and safety points be posed as questions for the collaboration?\n\n### Verena Ingrid Martinez Outschoorn\n\nSalient points:\n\n- Urged engagement with the ICB not only for purchases but also for access to shared AI-oriented resources and infrastructure.", "participants": [], "tags": [], "documents": [{"label": "2026-06-17 - Meeting.cleaned.md", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5898905/2026-06-17%20-%20Meeting.cleaned.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-17 - Meeting.focus-areas.md", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5898906/2026-06-17%20-%20Meeting.focus-areas.md", "talk_title": null, "speaker_names": []}, {"label": "2026-06-17-meeting_saved_closed_caption.txt", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5898856/2026-06-17-meeting_saved_closed_caption.txt", "talk_title": null, "speaker_names": []}, {"label": "2026-06-17 - Meeting.summary.md", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5898907/2026-06-17%20-%20Meeting.summary.md", "talk_title": null, "speaker_names": []}, {"label": "Draft Slides for the ATLAS Week DIscussion", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5897835/Draft%20Slides%20for%20the%20ATLAS%20Week%20DIscussion.pdf", "talk_title": null, "speaker_names": []}, {"label": "GMT20260617-120739_Recording_2118x1320.mp4", "url": "https://indico.cern.ch/event/1700148/attachments/3297536/5898855/GMT20260617-120739_Recording_2118x1320.mp4", "talk_title": null, "speaker_names": []}], "contributions": [{"title": "ECSB Thoughts", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Discussion Towards Recommendations Development", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "CERN AI Strategy News", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Event Generation and Simulation", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Reconstruction, Calibration, Analysis", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Trigger and Real-Time Systems", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Data Quality Monitoring and Validation", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Operations and Detector Control", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Computing Operations", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Training and Community Building", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "The Larger Community and Open Data", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Sustainable and Safe AI", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}, {"title": "Cross-Cutting Concerns", "speaker_names": [], "documents": [], "minutes_md": null, "minutes_html": ""}], "source_name": "AI/ML study group", "source_color": "#dee5f5", "summary_html": "<p><a href=\"https://indico.cern.ch/event/1700148/\" target=\"_blank\" rel=\"noopener noreferrer\">Link To Indico<\/a><\/p>\n<p><a href=\"https://docs.google.com/presentation/d/1MahYeDXuxGEUh_XZ_WcEgV4jiDLW-472JLRLBPX0jL0/edit?slide=id.g3daa69fccf1_0_28#slide=id.g3daa69fccf1_0_28\" target=\"_blank\" rel=\"noopener noreferrer\">Template for presentation<\/a> (note, copy before modifying!)<\/p>\n", "minutes_html": "<h1>Meeting Summary<\/h1>\n<p>The discussion focused on reshaping the ATLAS AI/ML effort into a transversal support structure that strengthens, rather than replaces, existing CP and physics groups by providing common infrastructure, tooling, training, communication channels, and possibly a centralized ML repository or coherent software layer. Participants repeatedly emphasized avoiding ownership conflicts or siphoning people out of CP groups while improving standardization, model deployment, data access, scaling support, and cross-group knowledge transfer through liaisons, hackathons, concrete tasks, and common methods. The group also debated mandate and accountability, with some advocating a stronger ownership role for the ML group over infrastructure and best-practice recommendations, while others stressed coordination with software and computing structures already responsible for coherent production environments. Additional themes included operations-specific ML needs, methods papers and publication pathways, training and safety guidance for coding agents and agentic workflows, hardware and GPU planning under uncertainty, access to shared compute resources, and whether ATLAS should articulate short AI funding priorities or a white paper to support collaborators and inform future funding discussions.<\/p>\n<h2>Themes<\/h2>\n<ul>\n<li>\n<p>ML group mandate<\/p>\n<\/li>\n<li>\n<p>CP group support<\/p>\n<\/li>\n<li>\n<p>Common infrastructure<\/p>\n<\/li>\n<li>\n<p>Standardization<\/p>\n<\/li>\n<li>\n<p>Cross-group communication<\/p>\n<\/li>\n<li>\n<p>Liaisons<\/p>\n<\/li>\n<li>\n<p>Training<\/p>\n<\/li>\n<li>\n<p>Hackathons<\/p>\n<\/li>\n<li>\n<p>Central ML repository<\/p>\n<\/li>\n<li>\n<p>Software stack choices<\/p>\n<\/li>\n<li>\n<p>Operations ML<\/p>\n<\/li>\n<li>\n<p>Compute scaling<\/p>\n<\/li>\n<li>\n<p>GPU planning<\/p>\n<\/li>\n<li>\n<p>Shared compute access<\/p>\n<\/li>\n<li>\n<p>Funding priorities<\/p>\n<\/li>\n<li>\n<p>Publication strategy<\/p>\n<\/li>\n<li>\n<p>Methods papers<\/p>\n<\/li>\n<li>\n<p>Open data policy<\/p>\n<\/li>\n<li>\n<p>Coding agents<\/p>\n<\/li>\n<li>\n<p>Safety guidelines<\/p>\n<\/li>\n<\/ul>\n<h2>Action Items<\/h2>\n<p>| Owner | Action | Quote |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| Gordon T. Watts | Reformulate the slides using concrete examples to strengthen the case for changing how the ML group works. | These concrete examples have given both Michael and I a lot of really good grist to try and reformulate these slides a little bit to make the point stronger. |<\/p>\n<p>| Michael Kagan | Add a bullet about hackathons as a concrete mechanism for knowledge exchange and synchronization across groups. | We should add a bullet about hackathons. |<\/p>\n<p>| Michael Kagan | Clarify in the document that more training is needed for ML, coding agents, and agentic workflows, and point people to ATLAS-specific and external opportunities. | We can try to be a lot more clear about when there are opportunities for people to engage, because there are also summer and winter schools on machine learning and machine learning for physics. |<\/p>\n<p>| Michael Kagan | Set up task forces to study agentic workflows and related issues on both the data analysis and operations sides. | We should set up task forces to work on this, both on the data analysis side and on the operations side. |<\/p>\n<p>| Michael Kagan | Task Dan, James, and Katarina with producing the sustainability, equity, and safety slide by the next day. | I am going to task, by tomorrow, Dan, James, and Katarina to produce this slide. |<\/p>\n<p>| James Richard Catmore | Write material for the sustainability, equity, and safety slide, potentially in the form of questions for the collaboration. | I can write some. |<\/p>\n<p>| Gordon T. Watts | Discuss slide bullet points asynchronously on Mattermost and include Katerina and Sarah Williams in the discussion. | If you could, and then discussing them on Mattermost, that would be great. Make sure Katerina is part of that, and Sarah Williams, who's also been thinking about this. |<\/p>\n<p>| Michael Kagan | Gordon and Michael should produce the revised slides. | So you and I should produce slides by Sunish. |<\/p>\n<p>| Gordon T. Watts | Prepare a fresh version of the talk starting from scratch while keeping the current deck as documentation/reference. | Personally, I'm going to start from scratch, but use this as a reference. |<\/p>\n<p>| Dan Guest | Condense the slide text substantially. | In general, the text needs to be condensed down to a lot less points. It is way too much text. |<\/p>\n<p>| Dan Guest | Ensure the introduction states that a more detailed document is being developed to add concrete substance beyond the slides. | In the intro, we need to point out that we're working on a document to actually put some teeth on this stuff. |<\/p>\n<p>| Michael Kagan | Leave limited authorship out of the current recommendations and defer further discussion until after ATLAS week. | We will not say anything about limited authorship for now. |<\/p>\n<p>| Dan Guest | Encourage inclusion of training on repository permissions, safe development practices, and sandboxing when using agents in software onboarding. | Somewhere in the software introduction that we have, like the standard induction day stuff, we should be encouraging people to understand read and write permissions... If we are going to be telling people to use agents and such, it's worth considering explaining various ways of sandboxing them. |<\/p>\n<p>| Daniel Thomas Murnane | Consider a concrete recommendation for ATLAS to apply for a large EuroHPC GPU allocation managed by the ML group. | Atlas should apply for about 10 million GPU hours on EuroHPC as Atlas. The ML group is in charge of that allocation and gives it out. |<\/p>\n<p>| Lukas Alexander Heinrich | Consider a scaling task force to study where large-scale ML training and scaling could be impactful. | Maybe in terms of recommendation, there should be a task for a scaling task force. |<\/p>\n<h2>External Resources<\/h2>\n<p>| Resource | Type | Context |<\/p>\n<p>| --- | --- | --- |<\/p>\n<p>| ML forum | forum | Current ATLAS machine learning discussion venue; described as not working well enough in its present form. |<\/p>\n<p>| CP group liaisons | coordination structure | Existing overlap mechanism between ML efforts and CP groups. |<\/p>\n<p>| Common Methods Background Forum | forum/model | HMBS structure cited by Jason Oliver as a model for factorizing common work. |<\/p>\n<p>| Athena | software repository/framework | Used as the analogy for a centralized production-level software home that ML currently lacks. |<\/p
