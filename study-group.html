>\n<p>| ATLAS ML repo | proposed repository | Suggested centralized repository for production-level ML development across CP groups. |<\/p>\n<p>| Salt | ML tool/framework | Referenced as infrastructure in flavor tagging and in discussion of responsibility for efficient multi-GPU training and onboarding. |<\/p>\n<p>| Perlmutter | HPC system | Referenced as a system users should be able to run on efficiently. |<\/p>\n<p>| Base One | tool/system | Operations example where separate groups faced the same issues without communicating. |<\/p>\n<p>| Felix | tool/system | Operations example paired with Base One to illustrate duplicated effort. |<\/p>\n<p>| eLogs | data source | Example source operations might analyze with LLMs. |<\/p>\n<p>| tier 0 histograms | data source | Example data source for anomaly detection in operations. |<\/p>\n<p>| ONNX | software format/tool | Highlighted by James as important for inference and coherent ATLAS software integration. |<\/p>\n<p>| CERN SFT LCG software platforms | software platform | External releases that constrain ATLAS versions of Python, CUDA, and PyTorch. |<\/p>\n<p>| PyTorch | ML framework | Discussed as a likely common choice for parts of the ML stack. |<\/p>\n<p>| Jax | ML framework | Mentioned in discussion of avoiding too many production frameworks. |<\/p>\n<p>| Keras | ML framework | Mentioned in discussion of avoiding too many production frameworks. |<\/p>\n<p>| TensorFlow | ML framework | Mentioned in discussion of avoiding too many production frameworks. |<\/p>\n<p>| Mattermost | communication tool | Proposed for follow-up discussion on bullet points and revisions. |<\/p>\n<p>| EuroHPC | compute resource program | Suggested as a source of GPU hours for ATLAS-managed ML work. |<\/p>\n<p>| ICB | board | International Computing Board of ATLAS; key body for long-term computing purchases and planning. |<\/p>\n<p>| CRSG | committee/group | Referenced in relation to accountability for computing resource use. |<\/p>\n<p>| LHCC | committee | Referenced both in review obligations and in recommendations to computing coordinators. |<\/p>\n<p>| OAB | board/group | Referenced as a venue where inference and grid/Tier-0 issues were emphasized. |<\/p>\n<p>| NGT | funding/program example | Used as an example of ATLAS support letters for proposal activity. |<\/p>\n<p>| Genesis | proposal/program | Referenced in discussion of support letters tied to NGT-related proposals. |<\/p>\n<p>| HSF white papers | community white papers | Examples of AI/software priority documents involving ATLAS people but without official ATLAS branding. |<\/p>\n<p>| IRIS-HEP | community initiative | Referenced via hub efforts and white-paper style coordination. |<\/p>\n<p>| Stanford Human Center for AI | institution/example | Cited as an example of regularly updated AI priorities. |<\/p>\n<p>| Olivia | leadership-class machine | Norwegian machine cited as an example of non-HEP infrastructure that ATLAS collaborators can apply to use. |<\/p>\n<p>| Summer and winter schools on ML and ML for physics | training programs | External opportunities that ATLAS could better connect people to. |<\/p>\n<p>| ATLAS tutorial group | training structure | Identified as having a role in ATLAS-specific training. |<\/p>\n<p>| Carlo Challenge | challenge/benchmark | Example where accessible data and comparisons helped produce useful models. |<\/p>\n<h2>Talk Highlights<\/h2>\n<h3>Dan Guest<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Frame the proposal as supporting and organizing existing effort rather than correcting poor performance.<\/p>\n<\/li>\n<li>\n<p>Scope should focus on centralized deployment infrastructure, saving protocols, inference tooling in Athena, and shared tooling.<\/p>\n<\/li>\n<li>\n<p>Training within CP groups should remain in those groups.<\/p>\n<\/li>\n<li>\n<p>More training is needed, including coding-agent safety, permissions, and sandboxing.<\/p>\n<\/li>\n<li>\n<p>Transparency matters in funding-priority communication.<\/p>\n<\/li>\n<li>\n<p>Slides are too text-heavy and should signal that a fuller document will follow.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Do we want to encourage efforts to test what models and hardware we might need?<\/p>\n<\/li>\n<li>\n<p>Does it make sense for ATLAS to produce a clearer public explanation of AI priorities?<\/p>\n<\/li>\n<\/ul>\n<h3>Gordon T. Watts<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supports a framing centered on providing infrastructure and broader sharing.<\/p>\n<\/li>\n<li>\n<p>Wants high-level recommendations rather than deep technical prescriptions in the presentation.<\/p>\n<\/li>\n<li>\n<p>Sees value in concrete examples to motivate structural changes.<\/p>\n<\/li>\n<li>\n<p>Warns that cross-group liaison structures can fail without careful design.<\/p>\n<\/li>\n<li>\n<p>Supports short straw recommendations and possibly a very short priorities white paper.<\/p>\n<\/li>\n<li>\n<p>Advocates deferring limited authorship from current recommendations.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>How should the AI/ML cross-cutting group be staffed and interact with analyses?<\/p>\n<\/li>\n<li>\n<p>Are concerns mainly about ownership transfer from CP groups into an ML group?<\/p>\n<\/li>\n<\/ul>\n<h3>Lukas Heinrich<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued for a structure that channels ML effort across CP groups without siphoning away people.<\/p>\n<\/li>\n<li>\n<p>Stressed that ML discussions should happen in ML-heavy venues while domain work remains in CP groups.<\/p>\n<\/li>\n<li>\n<p>Proposed a centralized ML repository analogous to Athena and strategic choices on production frameworks.<\/p>\n<\/li>\n<li>\n<p>Advocated a machine-learning layer similar to the software group that can make recommendations on formats, frameworks, and inference strategies.<\/p>\n<\/li>\n<li>\n<p>Suggested hackathons and scaling task forces as concrete coordination mechanisms.<\/p>\n<\/li>\n<li>\n<p>Raised interest in communicating AI priorities and timelines relevant to funding calls.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>What are we trying to achieve with the structure?<\/p>\n<\/li>\n<li>\n<p>How do people in funding-priority discussions learn the ML group's collective priorities?<\/p>\n<\/li>\n<li>\n<p>If ATLAS applies for large allocations, how will it use them effectively?<\/p>\n<\/li>\n<\/ul>\n<h3>Daniel Murnane<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Said the current ML forum is not working and proposed an infrastructure-focused support group with liaisons and strike-team behavior.<\/p>\n<\/li>\n<li>\n<p>Argued the ML group should incubate and scale projects once they hit technical barriers.<\/p>\n<\/li>\n<li>\n<p>Pushed for a stronger ownership model around efficient training, tooling, onboarding, and benchmarking.<\/p>\n<\/li>\n<li>\n<p>Suggested the ML group should compare architectures and baselines systematically.<\/p>\n<\/li>\n<li>\n<p>Supported nimble task forces for emerging issues.<\/p>\n<\/li>\n<li>\n<p>Proposed a concrete EuroHPC GPU-hours recommendation.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>Who has ownership over inefficient training, bad data loaders, poor onboarding, or underused methods-paper opportunities?<\/li>\n<\/ul>\n<h3>Jason Oliver<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Supported Daniel's proposal and presented an alternative organizational visualization emphasizing shared resources.<\/p>\n<\/li>\n<li>\n<p>Suggested the Common Methods Background Forum as a structural model.<\/p>\n<\/li>\n<li>\n<p>Saw infrastructure groups as vehicles for standardization and faster adoption.<\/p>\n<\/li>\n<li>\n<p>Raised the need to measure computing use and workflow experience if the ML group issues recommendations.<\/p>\n<\/li>\n<li>\n<p>Suggested documenting community feedback about publication barriers.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>How should the alternative visualization differ from the earlier slide in people's interpretation?<\/p>\n<\/li>\n<li>\n<p>If recommendations are made, how can usage and outcomes be measured per group or workflow?<\/p>\n<\/li>\n<\/ul>\n<h3>Andreas Salzburger<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Advocated R&amp;D support, transversal infrastructure support, training, and concrete task-oriented coordination.<\/p>\n<\/li>\n<li>\n<p>Emphasized no need to restructure CP topical work, but rather to provide support, guidance, and expertise.<\/p>\n<\/li>\n<li>\n<p>Urged grounding the discussion in concrete examples and smaller deliverables.<\/p>\n<\/li>\n<li>\n<p>Highlighted the distinction between hardware use cases and the danger of conflating GPU needs.<\/p>\n<\/li>\n<li>\n<p>Supported better understanding of compute needs and costing as part of the ML group's mandate.<\/p>\n<\/li>\n<li>\n<p>Raised questions about how ATLAS should connect to external AI structures and funding initiatives.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>How can concrete steps be defined rather than more meetings?<\/p>\n<\/li>\n<li>\n<p>How should external structures and funding programs connect back into an ATLAS AI/ML structure?<\/p>\n<\/li>\n<\/ul>\n<h3>Joaquin Hoya<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Spoke from the operations side about weak cross-group communication and duplicated development.<\/p>\n<\/li>\n<li>\n<p>Wanted the new group to connect operations communities around common tools and infrastructure.<\/p>\n<\/li>\n<li>\n<p>Stressed that common tools and clear contacts with groups would be valuable.<\/p>\n<\/li>\n<li>\n<p>Noted that operations tooling constraints and release practices make technology choices especially critical.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>Can the new AI/ML group improve communication enough to stop groups from independently solving the same problems?<\/li>\n<\/ul>\n<h3>Michael Kagan<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Repeatedly stressed that physics/CP groups should continue training their own models.<\/p>\n<\/li>\n<li>\n<p>Pushed back on solutions that amount to 'just another meeting' and wanted concrete common work that accelerates innovation transfer.<\/p>\n<\/li>\n<li>\n<p>Favored adding hackathons and task forces, improving training and guidelines, and clarifying recommendations.<\/p>\n<\/li>\n<li>\n<p>Raised questions about operations-specific acceleration and tooling differences.<\/p>\n<\/li>\n<li>\n<p>Led discussion on publication strategy, methods papers, and deferring limited authorship.<\/p>\n<\/li>\n<li>\n<p>Framed hardware planning as a warning and support issue rather than a concrete procurement recommendation.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>What can an ML group provide to operations if projects remain in their home groups?<\/p>\n<\/li>\n<li>\n<p>Will operations need different tooling than CP groups?<\/p>\n<\/li>\n<li>\n<p>Do we want to consider recommending an ATLAS AI priorities white paper?<\/p>\n<\/li>\n<\/ul>\n<h3>James Richard Catmore<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>\n<p>Argued that much of the organizational issue is really about where topics are discussed and who attends which meetings.<\/p>\n<\/li>\n<li>\n<p>Said CP groups should not be restructured and the ML group's role should be support, guidance, common training, and generic-topic discussion.<\/p>\n<\/li>\n<li>\n<p>Clarified formal accountability for computing use lies with computing coordinators and existing structures.<\/p>\n<\/li>\n<li>\n<p>Explained software-group responsibility for maintaining a coherent ATLAS software stack, including external constraints from CERN SFT.<\/p>\n<\/li>\n<li>\n<p>Supported methods-oriented publication discussion and deferred ethical/safety slide drafting into question form.<\/p>\n<\/li>\n<\/ul>\n<p>Questions:<\/p>\n<ul>\n<li>\n<p>Is accountability really the main issue, or is the main issue making things work?<\/p>\n<\/li>\n<li>\n<p>Should ethical and safety points be posed as questions for the collaboration?<\/p>\n<\/li>\n<\/ul>\n<h3>Verena Ingrid Martinez Outschoorn<\/h3>\n<p>Salient points:<\/p>\n<ul>\n<li>Urged engagement with the ICB not only for purchases but also for access to shared AI-oriented resources and infrastructure.<\/li>\n<\/ul>\n"}, {"id": "AI/ML study group-1707131", "type": "meeting", "title": "AI/ML Study Group - Tenth Meeting", "date": "2026-07-07", "important": true, "short_label": "Report Outline, ATLAS Week Feedback", "summary_md": "[Link To Indico](https://indico.cern.ch/event/1707131/)", "minutes_md": null, "participants": [], "tags": [], "documents": [{"label": "Report Outline (VERY DRAFTY)", "url": "https://docs.google.com/document/d/1r3CslYHTDPydouwDof1aHMjJ1YUfaywxhlvbidKXtTM/edit?tab=t.0#heading=h.rbgwix90n1va", "talk_title": "Report Outline", "speaker_names": []}, {"label": "Report Outline (VERY DRAFTY).pdf", "url": "https://indico.cern.ch/event/1707131/contributions/7180181/attachments/3309373/5922237/Report%20Outline%20(VERY%20DRAFTY).pdf", "talk_title": "Report Outline", "speaker_names": []}, {"label": "2026-06-25 - atlas-week-talk-comments.md", "url": "https://indico.cern.ch/event/1707131/contributions/7180182/attachments/3309377/5923262/2026-06-25%20-%20atlas-week-talk-comments.md", "talk_title": "ATLAS Week Feedback", "speaker_names": []}, {"label": "ATLAS Week Feedback.pdf", "url": "https://indico.cern.ch/event/1707131/contributions/7180182/attachments/3309377/5922232/ATLAS%20Week%20Feedback.pdf", "talk_title": "ATLAS Week Feedback", "speaker_names": []}, {"label": "ATLAS Week Feedback", "url": "https://docs.google.com/document/d/1Umizhhl0h8dcVaXdiVb7q8WvYT8GiY2UlsThmaIEaKw/edit?tab=t.0#heading=h.3ri136f8dtu", "talk_title": "ATLAS Week Feedback", "speaker_names": []}, {"label": "Pre Report To Do List.pdf", "url": "https://indico.cern.ch/event/1707131/contributions/7180182/attachments/3309377/5922234/Pre%20Report%20To%20Do%20List.pdf", "talk_title": "ATLAS Week Feedback", "speaker_names": []}, {"label": "Pre Report To Do List", "url": "https://docs.google.com/document/d/1NxexoGIGrYzhsPoxHTB_mzpgYCCyoha_vJPeqt3I6dY/edit?usp=sharing", "talk_title": "ATLAS Week Feedback", "speaker_names": []}], "contributions": [{"title": "News", "speaker_names": [], "documents": [], "minutes_md": "News:\n\n- OAB wants a \"final-ish\" presentation on September 7 and a ATLAS Weekly on Sept 15.\n- We are trying to get more direct (and indirect) contact with the CERN planning for their AI strategy. Latest news:\n  - It will be ratified at the Sept CERN Council Meeting\n  - It will not be public before then\n  - It is organized around a number of scientific \"pushes\" (called lighthouses)\n  - More as we learn more.\n- We have a short (10-minute) talk in Physics coordination on Monday - the aim is to gather feedback from PC. We have directed them at the ATLAS week talk and will give a very compressed version to remind them of the high points.\n- PC is also exploring the idea of a task force to push a bit on an agentic physics analysis / CP task.", "minutes_html": "<p>News:<\/p>\n<ul>\n<li>OAB wants a &quot;final-ish&quot; presentation on September 7 and a ATLAS Weekly on Sept 15.<\/li>\n<li>We are trying to get more direct (and indirect) contact with the CERN planning for their AI strategy. Latest news:\n<ul>\n<li>It will be ratified at the Sept CERN Council Meeting<\/li>\n<li>It will not be public before then<\/li>\n<li>It is organized around a number of scientific &quot;pushes&quot; (called lighthouses)<\/li>\n<li>More as we learn more.<\/li>\n<\/ul>\n<\/li>\n<li>We have a short (10-minute) talk in Physics coordination on Monday - the aim is to gather feedback from PC. We have directed them at the ATLAS week talk and will give a very compressed version to remind them of the high points.<\/li>\n<li>PC is also exploring the idea of a task force to push a bit on an agentic physics analysis / CP task.<\/li>\n<\/ul>\n"}, {"title": "Report Outline", "speaker_name udy Group - Eleventh Meeting", "date": "2026-07-14", "important": false, "short_label": null, "summary_md": "[Link To Indico](https://indico.cern.ch/event/1707148/)", "minutes_md": null, "participants": [], "tags": [], "documents": [], "contributions": [], "source_name": "AI/ML study group", "source_color": "#dee5f5", "summary_html": "<p><a href=\"https://indico.cern.ch/event/1707148/\" target=\"_blank\" rel=\"noopener noreferrer\">Link To Indico<\/a><\/p>\n", "minutes_html": ""}, {"id": "evt-002", "type": "external", "title": "Final Report", "date": "2026-07-15", "important": false, "short_label": null, "summary_md": "Added from committee add event.", "minutes_md": null, "participants": [], "tags": [], "documents": [], "contributions": [], "source_name": null, "source_color": null, "summary_html": "<p>Added from committee add event.<\/p>\n", "minutes_html": ""}], "indico_meeting_source": null, "indico_category_sources": [{"name": "AI/ML study group", "source_type": "category", "category_id": 21213, "event_id": null, "base_url": "https://indico.cern.ch", "color": "#dee5f5", "title_matches": [], "title_exclude_patterns": []}, {"name": "Offline Activity Coordination Board", "source_type": "event", "category_id": null, "event_id": "1688935", "base_url": "https://indico.cern.ch", "color": "#ecf5de", "title_matches": [], "title_exclude_patterns": []}], "committee": {"name": "ATLAS AI Study Group", "subtitle": null, "description_md": null, "notes_md": null, "start_date": "2026-02-15", "end_date": "2026-08-01", "description_html": "", "notes_html": ""}}</script>
  <script>(() => {
  const root = document.getElementById("app");
  const dataTag = document.getElementById("committee-data");

    root.innerHTML = "<div class='error'>Invalid embedded committee data.</div>";
    return;
  }

  const storageKey = `committee-history:${window.location.pathname}:${data.committee?.name || "default"}`;
  const seenStorageKey = `${storageKey}:seen`;
  const maxSeenEntries = 500;
  const validEventIds = new Set((data.events || []).map((event) => event.id).filter((id) => typeof id === "string" && id));
  const state = {
    query: "",
    selectedId: data.events?.[0]?.id ?? null,

    timelineScrollTop: 0,
  };
  const namedPalette = {
    sky: { background: "#e0f2fe", color: "#075985", border: "#bae6fd" },
    emerald: { background: "#d1fae5", color: "#065f46", border: "#a7f3d0" },
    rose: { background: "#ffe4e6", color: "#9f1239", border: "#fecdd3" },
    amber: { background: "#fef3c7", color: "#92400e", border: "#fde68a" },
    violet: { background: "#ede9fe", color: "#5b21b6", border: "#ddd6fe" },
    slate: { background: "#e2e8f0", color: "#334155", border: "#cbd5e1" },
  };

  function fmtDate(value) {
    const d = new Date(`${value}T12:00:00`);
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }

  function fmtCompactDate(value) {
    const d = new Date(`${value}T12:00:00`);
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }

  function getStyle(type) {
    const styles = data.event_type_styles || {};
    return styles[type] || { label: type, color: "slate" };
  }

  function hexToRgb(value) {
    const normalized = String(value || "").trim();
    const shortMatch = normalized.match(/^#([0-9a-f]{3})$/i);
    if (shortMatch) {
      const [r, g, b] = shortMatch[1].split("");
      return [parseInt(r + r, 16), parseInt(g + g, 16), parseInt(b + b, 16)];
    }
    const longMatch = normalized.match(/^#([0-9a-f]{6})$/i);
    if (!longMatch) return null;
    const digits = longMatch[1];
    return [
      parseInt(digits.slice(0, 2), 16),
      parseInt(digits.slice(2, 4), 16),
      parseInt(digits.slice(4, 6), 16),
    ];
  }

  function rgbToHex(rgb) {
    return `#${rgb.map((value) => Math.max(0, Math.min(255, value)).toString(16).padStart(2, "0")).join("")}`;
  }

  function mix(rgb, target, weight) {
    return rgb.map((value, index) => Math.round(value + (target[index] - value) * weight));
  }

  function buildTone(value) {
    if (namedPalette[value]) return namedPalette[value];
    const rgb = hexToRgb(value);
    if (!rgb) return namedPalette.slate;
    return {
      background: rgbToHex(rgb),
      color: "#0f172a",
      border: rgbToHex(mix(rgb, [15, 23, 42], 0.14)),
    };
  }

  function eventMatches(event, query) {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    const contributionBits = (event.contributions || []).flatMap((contribution) => [
      contribution.title,
      contribution.minutes_md,
      ...(contribution.speaker_names || []),
    ]);
    const haystack = [event.title, event.type, event.summary_md, event.minutes_md, ...(event.tags || []), ...(event.participants || []), ...contributionBits]
      .join(" ")
      .toLowerCase();
    return haystack.includes(q);
  }

  function groupedByYear(events) {
    const grouped = new Map();
    for (const event of events) {
      const year = new Date(`${event.date}T12:00:00`).getFullYear().toString();
      if (!grouped.has(year)) grouped.set(year, []);
      grouped.get(year).push(event);
    }
    return [...grouped.entries()].sort((a, b) => Number(a[0]) - Number(b[0]));
  }

  function esc(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function styleAttr(tone) {
    return `style="background:${esc(tone.background)};color:${esc(tone.color)};border-color:${esc(tone.border)}"`;
  }

  function dotStyleAttr(tone) {
    return `style="background:${esc(tone.background)};border-color:${esc(tone.border)}"`;
  }

  function renderPill(label, color, extraClass = "") {
    const tone = buildTone(color);
    const className = extraClass ? `pill ${extraClass}` : "pill";
    return `<span class="${esc(className)}" ${styleAttr(tone)}>${esc(label)}</span>`;
  }

  function renderDoc(doc) {
    return doc.url
      ? `<a href="${esc(doc.url)}" target="_blank" rel="noopener noreferrer">${esc(doc.label)}</a>`
      : esc(doc.label);
  }

  function escapeRegExp(value) {
    return String(value).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function looksLikeIdentifierTitle(value) {
    const normalized = String(value).replace(/\s+/g, " ").trim();
    if (!normalized) return true;
    if (/^[A-Z0-9!._/-]+$/.test(normalized)) return true;
    const letters = (normalized.match(/[A-Za-z]/g) || []).length;
    const words = normalized.split(/\s+/).filter(Boolean);
    return words.length === 1 && letters <= 8;
  }

  function shortTalkTitle(group) {
    const normalizedTalkTitle = String(group.talkTitle || "").replace(/\s+/g, " ").trim();
    if (normalizedTalkTitle) {
      return normalizedTalkTitle;
    }

    const source = group.docs?.[0]?.label || "";
    let value = String(source).replace(/\.[^.]+$/, "");
    value = value.replace(/([a-z0-9])([A-Z])/g, "$1 $2");
    value = value.replace(/[_-]+/g, " ");
    value = value.replace(/\b\d{6,8}\b/g, " ");
    value = value.replace(/\b(?:amgmeeting|amg)\b/gi, " ");
    value = value.replace(/\bcopy\b/gi, " ");
    value = value.replace(/\b\d+\b\s*$/g, " ");
    for (const speaker of group.speakers || []) {
      const pattern = new RegExp(`\\b${escapeRegExp(speaker)}\\b\\s*$`, "i");
      value = value.replace(pattern, "").trim();
    }
    value = value.replace(/\s+/g, " ").trim();
    return value || source || "Untitled talk";
  }

  function groupDocuments(documents) {
    const groups = [];
    const lookup = new Map();
    for (const doc of documents || []) {
      if (!doc.talk_title && !(doc.speaker_names || []).length) {
        groups.push({ kind: "single", doc });
        continue;
      }
      const speakers = doc.speaker_names || [];
      const key = `${doc.talk_title || ""}::${speakers.join("|")}`;
      if (!lookup.has(key)) {
        const group = { kind: "talk", talkTitle: doc.talk_title || "", speakers, docs: [] };
        lookup.set(key, group);
        groups.push(group);
      }
      lookup.get(key).docs.push(doc);
    }
    return groups;
  }

  function renderDocumentGroups(documents) {
    return groupDocuments(documents).map((group) => {
      if (group.kind === "single") {
        return `<li>${renderDoc(group.doc)}</li>`;
      }
      const speakerLine = group.speakers.length ? `<span class="muted-text">${esc(group.speakers.join(", "))}</span>` : "";
      const files = group.docs.map((doc) => `<li>${renderDoc(doc)}</li>`).join("");
      return `
        <li class="document-item">
          <div class="document-meta">
            <strong>${esc(shortTalkTitle(group))}</strong>
            ${speakerLine}
          </div>
          <ul class="document-sublist">${files}</ul>
        </li>
      `;
    }).join("");
  }

  function renderContribution(contribution) {
    const speakers = (contribution.speaker_names || [])
      .map((speaker) => `<span class="chip">${esc(speaker)}</span>`)
      .join("");
    const documents = renderDocumentGroups(contribution.documents || []);
    return `
      <article class="contribution-card">
        <div class="contribution-header">
          <h5>${esc(contribution.title || "Untitled talk")}</h5>
        </div>
        <div class="chips">${speakers || "<span class='muted-text'>No speakers listed</span>"}</div>
        ${contribution.minutes_html ? `<div class="summary contribution-minutes">${contribution.minutes_html}</div>` : ""}
        <div class="contribution-documents">
          <h6>Documents</h6>
          <ul>${documents || "<li class='muted-text'>None</li>"}</ul>
        </div>
      </article>
    `;
  }

  function isEditableTarget(target) {
    if (!(target instanceof HTMLElement)) return false;
    const tagName = target.tagName;
    return target.isContentEditable || tagName === "INPUT" || tagName === "TEXTAREA" || tagName === "SELECT";
  }

  function loadState() {
    try {
      const raw = window.sessionStorage.getItem(storageKey);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (typeof saved.query === "string") state.query = saved.query;
      if (typeof saved.selectedId === "string" && saved.selectedId) state.selectedId = saved.selectedId;
      if (Number.isFinite(saved.timelineScrollTop)) state.timelineScrollTop = saved.timelineScrollTop;
    } catch {}
  }

  function pruneSeenIds(entries) {
    const normalized = Object.entries(entries || {})
      .filter(([id, seenAt]) => validEventIds.has(id) && typeof seenAt === "string" && Number.isFinite(Date.parse(seenAt)))
      .sort((a, b) => Date.parse(b[1]) - Date.parse(a[1]));
    return Object.fromEntries(normalized.slice(0, maxSeenEntries));
  }

  function loadSeenState() {
    try {
      const raw = window.localStorage.getItem(seenStorageKey);
      if (!raw) return;
      state.seenIds = pruneSeenIds(JSON.parse(raw));
    } catch {}
  }

  function persistSeenState() {
    try {
      state.seenIds = pruneSeenIds(state.seenIds);
      window.localStorage.setItem(seenStorageKey, JSON.stringify(state.seenIds));
    } catch {}
  }

  function markSeen(eventId) {
    if (!validEventIds.has(eventId)) return;
    state.seenIds[eventId] = new Date().toISOString();
    persistSeenState();
  }

  function persistState() {
    try {
      window.sessionStorage.setItem(
        storageKey,
        JSON.stringify({
          query: state.query,
          selectedId: state.selectedId,
          timelineScrollTop: state.timelineScrollTop,
        }),
      );
    } catch {}
  }

  function render() {
    const previousTimeline = root.querySelector("#timeline");
    if (previousTimeline) {
      state.timelineScrollTop = previousTimeline.scrollTop;
    }
    const activeElement = document.activeElement;
    const searchWasFocused = activeElement?.id === "search";
    const searchSelectionStart = searchWasFocused ? activeElement.selectionStart : null;
    const searchSelectionEnd = searchWasFocused ? activeElement.selectionEnd : null;
    const showClearSearch = state.query.trim().length > 0;
    const events = (data.events || []).filter((e) => eventMatches(e, state.query));
    const selected = events.find((e) => e.id === state.selectedId) || events[0] || data.events?.[0];
    if (selected) state.selectedId = selected.id;

    const years = groupedByYear(events);
    const committee = data.committee || {};
    const start = committee.start_date ? fmtDate(committee.start_date) : "";
    const end = committee.end_date ? fmtDate(committee.end_date) : "Present";
    const todayKey = new Date().toISOString().slice(0, 10);

    root.innerHTML = `
      <div class="page">
        <header class="hero card">
          <div>
            <h1>${esc(committee.name || "Committee History")}</h1>
            <p class="subtitle">${esc(committee.subtitle || "")}</p>
            <div class="chips">
              <span class="chip">${esc(start)} -> ${esc(end)}</span>
            </div>
          </div>
          <label class="search">
            <span>Search</span>
            <div class="search-row">
              <input id="search" value="${esc(state.query)}" placeholder="Search events, participants, tags..." />
              <button
                type="button"
                class="search-clear${showClearSearch ? "" : " hidden"}"
                aria-label="Clear search"
                title="Clear search"
                ${showClearSearch ? "" : "tabindex=\"-1\" aria-hidden=\"true\""}
              >x</button>
            </div>
          </label>
        </header>
        <main class="split">
          <section class="card panel detail" id="detail"></section>
          <section class="card panel timeline" id="timeline"></section>
        </main>
      </div>
    `;

    const detail = root.querySelector("#detail");
    const timeline = root.querySelector("#timeline");
    if (!selected) {
      detail.innerHTML = "<p>No events available.</p>";
      timeline.innerHTML = "<p>No events available.</p>";
      return;
    }

    const selectedStyle = getStyle(selected.type);
    const docs = renderDocumentGroups(selected.documents || []);
    const contributions = (selected.contributions || []).map((contribution) => renderContribution(contribution)).join("");
    const participants = (selected.participants || []).map((p) => `<span class="chip">${esc(p)}</span>`).join("");
    const tags = (selected.tags || []).map((t) => `<span class="chip muted">${esc(t)}</span>`).join("");
    const selectedSourcePill = selected.source_name && selected.source_color
      ? renderPill(selected.source_name, selected.source_color)
      : "";
    const summarySection = selected.summary_html
      ? `<section><h4>Summary</h4><div class="summary">${selected.summary_html}</div></section>`
      : "";
    const minutesSection = selected.minutes_html
      ? `<section><h4>Minutes</h4><div class="summary">${selected.minutes_html}</div></section>`
      : "";
    const contributionsSection = contributions
      ? `<section><h4>Talk Minutes</h4><div class="contribution-list">${contributions}</div></section>`
      : "";

    detail.innerHTML = `
      <div class="panel-header"><h2>Selected Entry</h2><div class="panel-pills">${renderPill(selectedStyle.label, selectedStyle.color)}${selectedSourcePill}</div></div>
      <article>
        <h3>${esc(selected.title)}</h3>
        <div class="meta">${esc(fmtDate(selected.date))}${selected.important ? " Â· major event" : ""}</div>
        ${summarySection}
        ${minutesSection}
        <section><h4>Participants</h4><div class="chips">${participants || "<span class='muted-text'>None</span>"}</div></section>
        <section><h4>Documents</h4><ul>${docs || "<li class='muted-text'>None</li>"}</ul></section>
        ${contributionsSection}
        <section><h4>Tags</h4><div class="chips">${tags || "<span class='muted-text'>None</span>"}</div></section>
      </article>
    `;

    let dividerInserted = false;
    let timelineHtml = `<div class="panel-header"><h2>Timeline</h2></div><div class="timeline-list">`;
    for (const [year, list] of years) {
      timelineHtml += `<div class="year-block"><div class="year">${esc(year)}</div>`;
      for (const event of list) {
        const style = getStyle(event.type);
        const tone = buildTone(style.color);
        const isMajor = Boolean(event.important);
        const isSeen = Boolean(state.seenIds[event.id]);
        const isSelected = selected.id === event.id;
        const cls = isMajor ? "timeline-item major" : "timeline-item minor";
        const sourcePill = event.source_name && event.source_color
          ? renderPill(event.source_name, event.source_color, "small")
          : "";
        if (!dividerInserted && event.date >= todayKey) {
          timelineHtml += `
            <div class="timeline-divider" aria-hidden="true">
              <span class="timeline-divider-line"></span>
              <span class="timeline-divider-pill">Future</span>
            </div>
          `;
          dividerInserted = true;
        }
        timelineHtml += `
          <button class="${cls}${isSelected ? " selected" : ""}" data-event-id="${esc(event.id)}" title="${esc(event.title)} Â· ${esc(fmtDate(event.date))} Â· ${esc(style.label)}">
            <span class="timeline-rail">
              <span class="dot" ${dotStyleAttr(tone)}></span>
              <span class="connector"></span>
            </span>
            <span class="timeline-content">
              <span class="date">${esc(isMajor ? fmtDate(event.date) : fmtCompactDate(event.date))}</span>
              <span class="title">${esc(event.title)}</span>
              ${isSeen ? '<span class="seen-badge" aria-label="Seen">Seen</span>' : ""}
              <span class="timeline-pills">${renderPill(style.label, style.color, "small")}${sourcePill}</span>
              ${isMajor ? `<span class="short">${esc(event.short_label || event.title)}</span>` : ""}
            </span>
          </button>
        `;
      }
      timelineHtml += "</div>";
    }
    timelineHtml += "</div>";
    timeline.innerHTML = timelineHtml;
    timeline.scrollTop = state.timelineScrollTop;

    const search = root.querySelector("#search");
    const searchClear = root.querySelector(".search-clear");
    search?.addEventListener("input", (ev) => {
      state.query = ev.target.value;
      persistState();
      render();
    });
    searchClear?.addEventListener("click", () => {
      state.query = "";
      persistState();
      render();
      const nextSearch = root.querySelector("#search");
      nextSearch?.focus();
    });
    if (searchWasFocused && search) {
      search.focus();
      if (searchSelectionStart !== null && searchSelectionEnd !== null) {
        search.setSelectionRange(searchSelectionStart, searchSelectionEnd);
      }
    }
    timeline.addEventListener("scroll", () => {
      state.timelineScrollTop = timeline.scrollTop;
      persistState();
    }, { passive: true });
    timeline.querySelectorAll("[data-event-id]").forEach((el) => {
      el.addEventListener("click", () => {
        const eventId = el.getAttribute("data-event-id");
        state.selectedId = eventId;
        markSeen(eventId);
        state.timelineScrollTop = timeline.scrollTop;
        persistState();
        render();
      });
    });
    persistState();
  }

  loadState();
  loadSeenState();
  render();

  window.addEventListener("pagehide", () => {
    const timeline = root.querySelector("#timeline");
    if (timeline) state.timelineScrollTop = timeline.scrollTop;
    persistState();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey) return;
    if (isEditableTarget(event.target)) return;
    const search = root.querySelector("#search");
    if (!search) return;
    event.preventDefault();
    search.focus();
    const valueLength = search.value.length;
    search.setSelectionRange(valueLength, valueLength);
  });
})();
</script>
</body>
</html>
